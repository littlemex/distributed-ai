apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-l40s
spec:
  disruption:
    budgets:
    - nodes: 10%
    consolidateAfter: 5m
    consolidationPolicy: WhenEmpty
  limits:
    cpu: "200"
    memory: 2000Gi
  template:
    metadata:
      labels:
        distributed-ai/device: nvidia
        node-role: gpu-l40s
    spec:
      expireAfter: Never
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-ddp
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["g6e.12xlarge"]
      - key: topology.kubernetes.io/zone
        operator: In
        values: ["ap-northeast-1a"]
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: kubernetes.io/os
        operator: In
        values: ["linux"]
      taints:
      - effect: NoSchedule
        key: nvidia.com/gpu
      terminationGracePeriod: 1h
