# vLLM tuning overlay for Qwen/Qwen3.8-27B.
# Layered on charts/vllm-serving/values.yaml with `helm template -f`.
# The MODEL FACTS this tuning derives from live in serving/models/qwen3.8-27b.yaml.
#
# Why these values (all rooted in the hybrid linear-attention architecture):
#  - architecture qwen3_5 needs vLLM >= 0.27.0 (Qwen3_5ForConditionalGeneration is registered
#    there); v0.27.1 is pinned in the image.
#  - 48 of 64 layers are linear_attention (Gated DeltaNet). Prefix caching is NOT supported
#    for the recurrent-state layers -> enablePrefixCaching stays false. Do not advertise
#    "cheap repeated system prompts" for this model.
#  - The recurrent state, not the paged KV pool, caps concurrency -> maxNumSeqs kept low.
#  - bf16 weights ~54 GiB do not fit one 48 GiB L40S -> tensorParallelSize 4 on g6e.12xlarge
#    (num_kv_heads=4 divides TP4). TP2 also works on a 2-GPU slice if the pool changes.
#  - native context is 262144; capped to 32768 for a first bring-up.

image: vllm/vllm-openai:v0.27.1
model: Qwen/Qwen3.8-27B
nodeRole: gpu-l40s
gpuCount: 4
tensorParallelSize: 4
maxModelLen: 1048576        # 1M via YaRN (factor 4 x native 262144). See ropeScaling below.
gpuMemoryUtilization: 0.92
maxNumSeqs: 2               # 1M KV ~16GiB/rank per seq; keep concurrency low for the long-context test
hfOverrides: '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}'
extraEnv:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"   # allow max_model_len > native; YaRN handles the extended range
enablePrefixCaching: false

# MTP self-speculative decoding: Qwen3.8-27B ships a 1-layer MTP head, so this needs no separate
# draft model and is lossless (target-verified). num_speculative_tokens 3 reuses the MTP layer
# multi-step; measured ~1.69x TPOT at c=1 (FP8/random) vs no-spec, and composes with YaRN 1M.
speculativeConfig: '{"method": "mtp", "num_speculative_tokens": 3}'

# tool calling: the chat_template emits Qwen3 XML (<tool_call><function=..><parameter=..>),
# so the matching vLLM parser is qwen3_coder (hermes expects JSON and would fail to parse).
enableAutoToolChoice: true
toolCallParser: qwen3_coder

# serve in non-thinking mode by default (thinking + greedy decoding endlessly repeats, and an
# agent backend does not want a reasoning preamble each turn). Per-request chat_template_kwargs
# can re-enable it. Verified: enable_thinking=false returns a clean 2-token answer vs a verbose
# thinking trace.
chatTemplateKwargs: '{"enable_thinking": false}'
