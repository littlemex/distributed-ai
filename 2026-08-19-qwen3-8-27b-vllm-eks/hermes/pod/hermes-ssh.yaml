# SSH-able Hermes Agent (Nous Research) pod, using the self-hosted Qwen3.8-27B as its model
# via the OpenAI-compatible "ollama" provider override. CPU pod on the `cpu` pool.
# openssh installed at start on the published hermes image. Hermes requires >=64K context,
# so the vLLM overlay serves max_model_len 65536.
#
# Prereqs (create once):
#   kubectl -n distai create configmap hermes-files --from-file=config.yaml=config.yaml \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n distai create secret generic hermes-ssh \
#     --from-file=authorized_keys=<pubkey> --dry-run=client -o yaml | kubectl apply -f -
#   (agents.sh setup syncs the ssh key into hermes-ssh once this Deployment exists)
apiVersion: apps/v1
kind: Deployment
metadata: { name: hermes-ssh, labels: { app: hermes-ssh } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: hermes-ssh } }
  template:
    metadata:
      labels: { app: hermes-ssh }
      annotations: { karpenter.sh/do-not-disrupt: "true" }
    spec:
      nodeSelector: { node-role: cpu }
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.18
          env:
            - { name: OLLAMA_API_KEY, value: "vllm-local" }
            - { name: OLLAMA_BASE_URL, value: "http://vllm-qwen-qwen3-8-27b:8000/v1" }
            - { name: HOME, value: "/root" }
          command: ["/bin/sh","-lc"]
          args:
            - >
              set -e;
              apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-server >/dev/null;
              mkdir -p /run/sshd /root/.ssh /root/.hermes;
              install -m 600 /opt/ssh/authorized_keys /root/.ssh/authorized_keys;
              cp /opt/hermes-config/config.yaml /root/.hermes/config.yaml;
              ln -sf /opt/hermes/bin/hermes /usr/local/bin/hermes;
              ssh-keygen -A;
              printf 'PermitRootLogin prohibit-password\nPubkeyAuthentication yes\nPasswordAuthentication no\nAcceptEnv OLLAMA_*\n' > /etc/ssh/sshd_config.d/hermes.conf;
              printf 'OLLAMA_API_KEY=vllm-local\nOLLAMA_BASE_URL=http://vllm-qwen-qwen3-8-27b:8000/v1\nPATH=/usr/local/bin:/usr/bin:/bin:/opt/hermes/bin\n' > /etc/environment;
              echo '[ready] ssh hermes ; then run: hermes';
              exec /usr/sbin/sshd -D -e
          ports: [{ name: ssh, containerPort: 22 }]
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 6Gi }
          volumeMounts:
            - { name: hermes-config, mountPath: /opt/hermes-config, readOnly: true }
            - { name: ssh-keys, mountPath: /opt/ssh, readOnly: true }
      volumes:
        - name: hermes-config
          configMap: { name: hermes-files }
        - name: ssh-keys
          secret: { secretName: hermes-ssh }
