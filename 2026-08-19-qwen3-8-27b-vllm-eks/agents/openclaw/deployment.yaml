# Always-on OpenClaw agent, backed by the self-hosted Qwen3.8-27B vLLM Service,
# with web search via the bedrock-websearch MCP tool (Bedrock does the search; Qwen
# stays the brain). CPU pod on the `cpu` Karpenter pool.
#
# The bedrock-websearch tool script + an AGENTS.md that teaches the agent to use it are
# mounted from a ConfigMap; the agent runs the tool via its shell tool (this OpenClaw build
# has no `openclaw mcp` subcommand — use the MCP path on builds that do). AWS credentials for
# Bedrock come from an EKS Pod Identity association bound to the `openclaw` ServiceAccount
# (no static keys in the image). Create the ConfigMap from the tool sources before applying:
#   kubectl -n "$QWEN_NAMESPACE" create configmap openclaw-tools \
#     --from-file=bedrock_websearch.py=../tools/bedrock-websearch/bedrock_websearch.py \
#     --from-file=AGENTS.md=../tools/bedrock-websearch/AGENTS.md \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-gateway
type: Opaque
stringData:
  token: "qwen-demo-token"        # demo only; rotate / move to a real secret store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  labels: { app: openclaw }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: openclaw } }
  template:
    metadata:
      labels: { app: openclaw }
      annotations: { karpenter.sh/do-not-disrupt: "true" }
    spec:
      serviceAccountName: openclaw        # Pod Identity -> Bedrock (web_search)
      nodeSelector: { node-role: cpu }
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.3.1
          env:
            - name: VLLM_API_KEY
              value: "vllm-local"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom: { secretKeyRef: { name: openclaw-gateway, key: token } }
            - name: BEDROCK_WS_REGION
              value: "us-east-1"          # Bedrock web_search regions: us-east-1|us-east-2|us-west-2
            - name: WEBSEARCH
              value: "0"                  # deploy.sh sets this to 1 with --websearch
          command: ["/bin/sh","-lc"]
          args:
            - >
              openclaw onboard --non-interactive --accept-risk --flow quickstart
              --auth-choice custom-api-key
              --custom-base-url "http://qwen-serving:8000/v1"
              --custom-model-id "Qwen/Qwen3.8-27B" --custom-compatibility openai
              --custom-api-key "vllm-local" --custom-provider-id "qwen-eks"
              --gateway-bind lan --gateway-port 18789 --gateway-auth token
              --gateway-token "$OPENCLAW_GATEWAY_TOKEN" || true;
              openclaw config set agents.defaults.model.primary "qwen-eks/Qwen/Qwen3.8-27B" || true;
              mkdir -p ~/.openclaw/workspace; [ "${WEBSEARCH:-0}" = 1 ] && cp /opt/tools/AGENTS.md ~/.openclaw/workspace/AGENTS.md || true;
              exec openclaw gateway run --bind lan
          ports: [{ name: http, containerPort: 18789 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: tools, mountPath: /opt/tools, readOnly: true }
      volumes:
        - name: tools
          configMap: { name: openclaw-tools }
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  labels: { app: openclaw }
spec:
  type: ClusterIP
  selector: { app: openclaw }
  ports: [{ name: http, port: 18789, targetPort: http }]
