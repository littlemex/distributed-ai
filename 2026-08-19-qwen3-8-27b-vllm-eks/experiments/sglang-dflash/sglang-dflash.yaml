# SGLang serving Qwen/Qwen3.8-27B with DFLASH2 speculative decoding (draft incoai/Qwen3.8-27B-DFlash2),
# on a SPOT g6e.12xlarge (separate quota from the on-demand vLLM). OpenAI-compatible on :8000.
#
# DFlash2 landed in sglang main AFTER the latest published nightly, so DFlash2DraftModel is missing
# from the image. We therefore install the sglang PYTHON package from main at start (on top of the
# nightly image, which already ships the prebuilt sgl-kernel / CUDA / torch — so no heavy kernel
# recompile). This is the article's `pip install "sglang @ git+...#subdirectory=python"` method.
apiVersion: apps/v1
kind: Deployment
metadata: { name: sglang-dflash, labels: { app: sglang-dflash } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: sglang-dflash } }
  template:
    metadata: { labels: { app: sglang-dflash } }
    spec:
      nodeSelector: { node-role: gpu-l40s-spot }
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: sglang
          image: lmsysorg/sglang:nightly-dev-cu12-20260818-c0b6474b
          command: ["/bin/sh","-lc"]
          args:
            - >
              set -e;
              echo '[dflash] installing sglang python from main (keeps prebuilt sgl-kernel)...';
              pip install -U --no-deps "sglang @ git+https://github.com/sgl-project/sglang.git#subdirectory=python" 2>&1 | tail -4;
              python3 -c "from sglang.srt.models.dflash import DFlash2DraftModel; print('[dflash] DFlash2DraftModel import OK')";
              exec python3 -m sglang.launch_server
              --model-path Qwen/Qwen3.8-27B --tp 4 --host 0.0.0.0 --port 8000
              --mem-fraction-static 0.75 --context-length 16384
              --speculative-algorithm DFLASH
              --speculative-draft-model-path incoai/Qwen3.8-27B-DFlash2
              --speculative-num-draft-tokens 8
          env:
            - { name: HF_HOME, value: /hf-cache }
          ports: [{ name: http, containerPort: 8000 }]
          resources:
            requests: { cpu: "8", memory: 64Gi, nvidia.com/gpu: 4 }
            limits: { memory: 64Gi, nvidia.com/gpu: 4 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 160
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: hf-cache, mountPath: /hf-cache }
      volumes:
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
        - { name: hf-cache, emptyDir: { sizeLimit: 120Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: sglang-dflash, labels: { app: sglang-dflash } }
spec:
  type: ClusterIP
  selector: { app: sglang-dflash }
  ports: [{ name: http, port: 8000, targetPort: http }]
