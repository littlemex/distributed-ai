{{- /*
image-build-comfyui — build the ComfyUI image IN-CLUSTER with rootless BuildKit and push to ECR,
so no local docker/finch is needed. This is a THIN CALLER of the shared image builder define
"image-builder.job" (from the image-builder-lib library chart, declared as a dependency in
Chart.yaml). It supplies only ComfyUI's identity (its Job name); the repository, tag, git context
sub-path, build-args, cpu, and ephemeral-storage all come from imageBuild values (values.yaml).
The Terraform "mechanism" half (image-builder namespace/SA, Pod Identity, ECR repo) is unchanged —
this project's comfyui-image-builder.tf attaches a ComfyUI ECR push policy to the SAME
image-builder role, so the existing ServiceAccount can push here too.

Vendor the library chart before rendering (re-run after the library changes):
  helm dependency build ./charts/comfyui

Render + apply (repository from `terraform output -raw comfyui_ecr_url`):
  helm template comfyui ./charts/comfyui \
    -s templates/image-build-comfyui.yaml \
    --set imageBuild.enabled=true \
    --set imageBuild.repository=$ECR_URL --set imageBuild.tag=v1 | kubectl apply -f -
  kubectl -n image-builder wait --for=condition=complete job/build-comfyui-v1 --timeout=45m
  kubectl -n image-builder logs -f job/build-comfyui-v1
  kubectl -n image-builder logs job/build-comfyui-v1 -c ecr-login   # if the init step failed

Re-building the SAME tag: delete the completed Job first (or bump the tag — recommended):
  kubectl -n image-builder delete job build-comfyui-{{ .Values.imageBuild.tag }} --ignore-not-found
*/ -}}
{{- if .Values.imageBuild.enabled }}
{{- /* ComfyUI's identity + sizing, injected with defaults so a values.yaml that omits them still
     builds correctly (the shared library's defaults are ddp-sample-sized: 30Gi / cpu 2 — too small
     for the ~15-20 GB ComfyUI image, so re-default here rather than silently fall back). buildArgs,
     gitRef, repository, tag stay in values as the user-facing knobs. */ -}}
{{- $args := deepCopy .Values.imageBuild -}}
{{- $_ := set $args "jobName" "build-comfyui" -}}
{{- $_ := set $args "contextSubPath" (.Values.imageBuild.contextSubPath | default "2026-08-12-comfyui-minmax-h3/image/comfyui") -}}
{{- $_ := set $args "cpu" (.Values.imageBuild.cpu | default "4") -}}
{{- $_ := set $args "ephemeralStorage" (.Values.imageBuild.ephemeralStorage | default "120Gi") -}}
{{- include "image-builder.job" $args }}
{{- end }}
