# 10-internode-bench.yaml
# Two-node (p5en x2 = H200 x16, EP16) UCCL-EP dispatch/combine microbenchmark.
#
# Uses the USE_DMABUF=1 source build of UCCL-EP staged on FSx at
# /fsx/uccl-dmabuf (see 01-build-probe.yaml + docs/GOTCHAS.md), NOT the PyPI
# wheel. The PyPI wheel registers GPU memory via ibv_reg_mr (needs
# nvidia_peermem) and fails with EOPNOTSUPP on this peermem-less node; the
# USE_DMABUF build registers GPU memory via ibv_reg_dmabuf_mr and needs no
# peermem. The build links against rdma-core >= v52 (for the newer efadv.h),
# so we prepend the staged rdma-core libs to LD_LIBRARY_PATH.
#
# Layout: a headless Service resolves rank0's pod by name; rank0 and rank1 each
# run torchrun with 8 procs. Only kubectl resources are created.
apiVersion: v1
kind: Service
metadata:
  name: uccl-bench
  namespace: default
spec:
  clusterIP: None
  selector:
    app: uccl-ep-bench
  ports:
    - name: rdzv
      port: 12355
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uccl-bench-init
  namespace: default
data:
  init.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    UCCL_DIR=/fsx/uccl-dmabuf
    WORKDIR=/workspace/ep_bench
    mkdir -p "$WORKDIR"
    # Use the FSx-staged bench scripts + the USE_DMABUF ep module.
    cp "$UCCL_DIR"/bench/*.py "$WORKDIR"/
    export PYTHONPATH="${UCCL_DIR}:${WORKDIR}:${PYTHONPATH:-}"
    # Prepend the staged rdma-core (>= v52) libs so ep.abi3.so resolves the
    # newer libibverbs/libefa it was built against, ahead of the OS rdma-core 50.
    export LD_LIBRARY_PATH="${UCCL_DIR}/lib:${LD_LIBRARY_PATH:-}"

    echo "[init] uccl.ep sanity (expect can_reg=True, host_allocated=False)"
    python -c "from uccl import ep; import uccl; print('uccl:', uccl.__file__); print('can_reg:', ep.can_register_rdma_gpu_buffer(0, 64<<20))"

    echo "[init] EFA devices"; ibv_devices || true
    echo "[init] rank=${RANK} world_size=${WORLD_SIZE} master=${MASTER_ADDR}:${MASTER_PORT}"
    if [ "${RANK}" != "0" ]; then
      for i in $(seq 1 60); do getent hosts "${MASTER_ADDR}" && break || sleep 2; done
    fi

    echo "[init] launching torchrun (nnodes=${WORLD_SIZE}, node_rank=${RANK})"
    export OMP_NUM_THREADS=6
    cd "$WORKDIR"
    exec torchrun \
      --nnodes="${WORLD_SIZE}" \
      --nproc_per_node=8 \
      --node_rank="${RANK}" \
      --master_addr="${MASTER_ADDR}" \
      --master_port="${MASTER_PORT}" \
      "${BENCH_SCRIPT}" ${BENCH_ARGS}
---
apiVersion: v1
kind: Pod
metadata:
  name: uccl-bench-rank0
  namespace: default
  labels: { app: uccl-ep-bench, rank: "0" }
spec:
  restartPolicy: Never
  subdomain: uccl-bench
  hostname: rank0
  nodeSelector: { node-role: gpu-p5en }
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
    - { key: vpc.amazonaws.com/efa, operator: Exists, effect: NoSchedule }
    - { key: capacity-reservation, operator: Exists, effect: NoSchedule }
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector: { matchLabels: { app: uccl-ep-bench } }
          topologyKey: kubernetes.io/hostname
  containers:
    - name: bench
      image: nvcr.io/nvidia/pytorch:25.01-py3
      command: ["/bin/bash", "/init/init.sh"]
      env:
        - { name: RANK, value: "0" }
        - { name: WORLD_SIZE, value: "2" }
        - { name: MASTER_ADDR, value: "rank0.uccl-bench.default.svc.cluster.local" }
        - { name: MASTER_PORT, value: "12355" }
        - { name: BENCH_SCRIPT, value: "test_internode.py" }
        - { name: BENCH_ARGS, value: "--num-tokens=4096 --hidden=7168 --num-topk=8 --num-experts=256" }
        - { name: FI_PROVIDER, value: "efa" }
        - { name: NCCL_DEBUG, value: "WARN" }
        - { name: NCCL_SOCKET_IFNAME, value: "eth0" }
        - { name: UCCL_SOCKET_IFNAME, value: "eth0" }
      resources:
        limits: { nvidia.com/gpu: 8, vpc.amazonaws.com/efa: 15, hugepages-2Mi: 5Gi, memory: 64Gi }
        requests: { nvidia.com/gpu: 8, vpc.amazonaws.com/efa: 15, memory: 64Gi }
      volumeMounts:
        - { name: init, mountPath: /init }
        - { name: shm, mountPath: /dev/shm }
        - { name: workspace, mountPath: /workspace }
        - { name: fsx, mountPath: /fsx }
      securityContext:
        capabilities: { add: ["IPC_LOCK"] }
  volumes:
    - { name: init, configMap: { name: uccl-bench-init } }
    - { name: shm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
    - { name: workspace, emptyDir: {} }
    - { name: fsx, persistentVolumeClaim: { claimName: fsx-claim } }
---
