name: release-pin

# A release tag and the release name written inside the tree it points at have to agree. Nothing at
# runtime notices when they do not: the URL a reader copies names one release, the clone is another,
# and both look successful. GitHub cannot refuse a tag push, so this cannot prevent the mistake — it
# makes it loud on the release itself, within a minute of the push, instead of surfacing in someone's
# terminal weeks later. The paved path that avoids the mistake in the first place is
# infra/scripts/cut-release.sh.
on:
  push:
    tags: ["release/eks-distributed-ai/v*"]

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      # The check compares against the tag HEAD is at, so it needs the tags, not just this commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the installers must pin this release
        run: ./infra/scripts/check-release-pin.sh
