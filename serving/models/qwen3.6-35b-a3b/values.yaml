# vLLM tuning overlay for Qwen/Qwen3.6-35B-A3B-FP8.
# Layered on charts/vllm-serving/values.yaml with `helm template -f`. Model facts live in
# model.env and FACTS.md; the window and concurrency come from profiles.env.
#
# Why these values:
#  - 256-expert MoE, 8 experts per token, so ~3B active of 35B stored. Prefill is compute-bound
#    and this workload is 99.5% prompt tokens, which is why this model is worth trying at all.
#  - Hybrid attention again: 40 layers, three linear-attention layers then one full, ten times
#    over. Unlike the dense sibling, prefix caching WORKS here — vLLM snapshots the recurrent state
#    alongside the paged KV. It is opt-in for hybrid models, so it needs the flag on the command
#    line; a missing flag means the model's default, which is off. Measured on AgentX's real traces
#    at 84.96% hit and 11.5x faster time to first token. See FACTS.md.
#  - Vision tower present (27 blocks, hidden 1152), so this one box can serve the OCR family too
#    and no separate VL deployment is needed. limitMmPerPrompt caps the memory that costs.
#  - fp8 weights ~35 GiB do not fit one 48 GiB L40S once KV and activations are counted, so
#    tensorParallelSize 4 on g6e.12xlarge. num_kv_heads is 2, which does NOT divide 4 -- vLLM
#    replicates KV heads across ranks in that case, which is correct but means KV is stored four
#    times. That is affordable here only because the geometry is 20 KiB per token; it is the first
#    thing to check if the KV cache comes out smaller than expected.
#  - The checkpoint is already fp8, so no online `quantization` flag: setting one on top would
#    ask vLLM to quantise weights that are quantised.

image: vllm/vllm-openai:v0.27.1
nodeRole: gpu-l40s
gpuCount: 4
tensorParallelSize: 4
gpuMemoryUtilization: 0.92

# Multimodal memory guard: this model reads images natively. Two per request is enough for the
# OCR family (a page and a crop) and bounds the vision tower's activation memory.
limitMmPerPrompt: '{"image": 2, "video": 1}'

extraEnv:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"   # allow max_model_len > native; YaRN handles the extension

# ON, and this is the measurement that matters most for this box. 94.9% of the prompt tokens in a
# measured agent episode were a re-read of the previous turn, which is 58% of the machine's time, so
# whether vLLM can keep the prefix across turns for a hybrid model decides whether the agent families
# belong here at all. It can. Getting to that answer took three attempts: the dense sibling's
# assumption was inherited into this file, then "measured" with the flag still off, then measured
# again with the overlay set to true but the chart emitting no flag at all. Read the engine's own
# config line every time, and treat a value in this file as a request rather than a fact.
enablePrefixCaching: true

# tool calling: Qwen3 chat templates emit XML (<tool_call><function=..><parameter=..>), so the
# matching vLLM parser is qwen3_coder. hermes expects JSON and would fail to parse.
enableAutoToolChoice: true
toolCallParser: qwen3_coder

# Serve in non-thinking mode by default: an agent backend does not want a reasoning preamble every
# turn, and thinking with greedy decoding has been observed to repeat endlessly on this family.
# Per-request chat_template_kwargs can re-enable it.
chatTemplateKwargs: '{"enable_thinking": false}'
