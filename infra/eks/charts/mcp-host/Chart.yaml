apiVersion: v2
name: mcp-host
description: |
  Host any number of MCP servers on CPU Pods in the "mcp" namespace, driven by a values list.
  Each entry in `mcps` renders one Deployment + Service; an entry is either `transport: http`
  (a server that speaks streamable-http natively, e.g. the xprof analysis MCP or the
  xprof-knowledge MCP) or `transport: stdio` (a stdio-only MCP wrapped by supergateway, e.g. the
  official MLflow MCP). Adding an MCP is adding an entry — no template change. A laptop reaches
  each over `kubectl port-forward` as a streamable-http endpoint.

  Optional per-entry AWS S3 Files mount (via the s3files-lib dependency) for an MCP that reads
  trace files in place; per-entry ServiceAccount for Pod-Identity credentials; a shared restricted
  securityContext and an IMDS-blocking NetworkPolicy by default.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: s3files-lib
    version: 0.1.0
    repository: "file://../s3files-lib"
