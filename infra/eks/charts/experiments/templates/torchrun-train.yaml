{{- /*
torchrun-train — single-node HF Trainer fine-tune of SmolLM2-135M via `torchrun`
(batch/v1 Job, zero operator). Backend gloo (CPU) or nccl (GPU). Reuses the hf-train-sample
image (train_smollm.py baked in) so one image covers both this and pytorchjob-train. This is
the "what can you do with NO operator" step; pytorchjob-train is the multi-node step above it.

Requires efs_enabled=true (static PV efs-neuron-workspace) and torchrunTrain.image set.

GPU note: nprocPerNode MUST equal gpu.count — torchrun spawns one proc per nproc and each
grabs one GPU; a mismatch makes procs contend for a GPU with no error.

Render + apply (CPU):
  helm template exp ./charts/experiments --set namespace=$NS \
    --set torchrunTrain.enabled=true --set torchrunTrain.image=$IMG | kubectl apply -f -
Render + apply (GPU, 1 g5 GPU):
  helm template exp ./charts/experiments --set namespace=$NS \
    --set torchrunTrain.enabled=true --set torchrunTrain.image=$IMG \
    --set torchrunTrain.backend=nccl --set torchrunTrain.nodeRole=gpu-g5 \
    --set torchrunTrain.nprocPerNode=1 \
    --set torchrunTrain.gpu.enabled=true --set torchrunTrain.gpu.count=1 | kubectl apply -f -
Verify:
  kubectl -n $NS logs -f job/smollm-torchrun
*/ -}}
{{- if .Values.torchrunTrain.enabled }}
{{- $v := .Values.torchrunTrain }}
{{- if not $v.image }}{{ fail "torchrunTrain.image is required (the hf-train-sample image URI)" }}{{- end }}
{{- /* The efs-shared-claim PVC is rendered once by templates/efs-shared-pvc.yaml (shared
     with pytorchjobTrain) so enabling both does not emit two copies of the same object. */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: smollm-torchrun
  namespace: {{ include "experiments.namespace" . }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: smollm-torchrun }
      # The CPU NodePool consolidates underutilized nodes after 30s and can evict this Pod
      # mid-training; do-not-disrupt pins it. Harmless on the GPU pools (WhenEmpty).
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role: {{ $v.nodeRole }}
      tolerations:
        - { key: capacity-reservation, operator: Exists, effect: NoSchedule }
        {{- if $v.gpu.enabled }}
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        {{- end }}
      # No fix-perms initContainer: the hf-train-sample image runs as root (uid 0) and the EFS
      # Access Point (efs.tf) enforces posixUser uid/gid 0, so every NFS write is already owned
      # correctly. HuggingFace / Trainer create the cache and output subdirs on first write.
      containers:
        - name: train
          image: {{ $v.image }}
          command:
            - torchrun
            - --standalone
            - --nproc_per_node={{ $v.nprocPerNode }}
            - /workspace/train_smollm.py
          env:
            - { name: HF_HOME, value: /shared/hf-cache }
            - { name: OUTPUT_DIR, value: /shared/output/torchrun-{{ $v.backend }} }
          resources:
            limits:
              {{- if $v.gpu.enabled }}
              nvidia.com/gpu: {{ $v.gpu.count | quote }}
              {{- end }}
              memory: {{ $v.memory }}
            requests:
              cpu: {{ $v.cpu | quote }}
              memory: {{ $v.memory }}
          volumeMounts:
            - { name: shared, mountPath: /shared }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: shared, persistentVolumeClaim: { claimName: efs-shared-claim } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }
{{- end }}
