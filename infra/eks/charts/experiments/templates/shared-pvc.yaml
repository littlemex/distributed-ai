{{- /*
shared-pvc — the ReadWriteMany PVC that torchrunTrain and pytorchjobTrain both bind to. It
targets whichever static PV matches .Values.sharedStorage.backend (openzfs | fsx | efs),
resolved by the experiments.sharedVolumeName helper. Split out of both workload templates so
there is exactly one PVC definition (rendering both workloads together used to emit two
identical PersistentVolumeClaim documents; harmless while they stayed identical, but the first
one to drift becomes a silent last-wins bug, and it invites copy-paste of a definition that
should have one source of truth).

Default backend is openzfs — the single-AZ FSx OpenZFS NFS home/general-shared layer
(openzfs.tf), which is ON by default. Switch with --set sharedStorage.backend=fsx (Lustre
scratch) or =efs (only if you opted EFS back in; it is demoted/off by default).

NOTE: each backend exposes a SINGLE static PV, so it can be Bound to ONE PVC at a time.
Applying this into a second namespace while the first PVC is still Bound leaves the second PVC
permanently Pending. Delete the first namespace's PVC first, or provision a second static PV
before running the same workload elsewhere.
*/ -}}
{{- if and (or .Values.torchrunTrain.enabled .Values.pytorchjobTrain.enabled) (not .Values.sharedStorage.existingClaimName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-claim
  namespace: {{ include "experiments.namespace" . }}
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: {{ include "experiments.sharedVolumeName" . }}
  resources:
    requests:
      storage: {{ .Values.sharedStorage.requestSize | default "256Gi" }}
{{- end }}
