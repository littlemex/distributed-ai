{{- /*
nccl-sshd — two-node NVIDIA NCCL all_reduce bench over EFA (sshd + mpirun).

Two pods on two different GPU nodes (podAntiAffinity), each with all GPUs + all EFA ENIs
and persistent sshd on port 2222. sshd MUST be PID-1 subordinate (started from command);
`kubectl exec`-started sshd gets SIGTERM on exec exit.

Render + apply:
  helm template exp ./charts/experiments \
    --set namespace=$NS --set ncclSshd.enabled=true | kubectl apply -f -

After both pods Running, distribute SSH keys (see the neuron-ddp header for the pattern),
then from the server pod run mpirun over -H ${SERVER_IP}:N,${CLIENT_IP}:N with
--mca plm_rsh_args '-p 2222' and FI_PROVIDER=efa (N = ncclSshd.gpuCount). EFA is active
when the NCCL log shows "NET/OFI Selected provider is efa ... transport protocol RDMA".
*/ -}}
{{- if .Values.ncclSshd.enabled }}
{{- $v := .Values.ncclSshd }}
{{- if not $v.gpuProduct }}{{ fail "ncclSshd.gpuProduct is required — set it to the target node's nvidia.com/gpu.product label (read it from a live node: kubectl get node <n> -o jsonpath='{.metadata.labels.nvidia\\.com/gpu\\.product}'). No default: a wrong SKU selector leaves the pods Pending forever with no error." }}{{- end }}
{{- range $role := (list "server" "client") }}
{{- if ne $role "server" }}
---
{{- end }}
apiVersion: v1
kind: Pod
metadata:
  name: nccl-{{ $role }}
  namespace: {{ include "experiments.namespace" $ }}
  labels:
    app: nccl-bench
    role: {{ $role }}
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  nodeSelector:
    nvidia.com/gpu.product: {{ $v.gpuProduct }}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: { app: nccl-bench }
          topologyKey: kubernetes.io/hostname
  tolerations:
    - { key: nvidia.com/gpu,                             operator: Exists, effect: NoSchedule }
    - { key: vpc.amazonaws.com/efa,                      operator: Exists, effect: NoSchedule }
    - { key: workload,                                   operator: Equal,  value: bench, effect: NoSchedule }
    - { key: capacity-reservation,                       operator: Exists, effect: NoSchedule }
    - { key: sagemaker.amazonaws.com/node-health-status, operator: Equal,  value: Schedulable, effect: NoSchedule }
  containers:
    - name: bench
      image: {{ $v.image }}
      command:
        - bash
        - -lc
        - |
          mkdir -p /run/sshd /root/.ssh && chmod 700 /root/.ssh
          ssh-keygen -A
          printf 'StrictHostKeyChecking no\nUserKnownHostsFile /dev/null\n' > /root/.ssh/config
          chmod 600 /root/.ssh/config
          exec /usr/sbin/sshd -D -p 2222
      securityContext:
        privileged: true   # Required for EFA device access and /dev/gdrdrv.
      env:
        - { name: FI_PROVIDER,            value: "efa" }
        - { name: FI_EFA_USE_DEVICE_RDMA, value: "1" }
        - { name: FI_EFA_FORK_SAFE,       value: "1" }
        - { name: NCCL_SOCKET_IFNAME,     value: "^lo,docker,veth" }
        - { name: NCCL_DEBUG,             value: "INFO" }
      resources:
        limits:
          nvidia.com/gpu:        {{ $v.gpuCount | quote }}
          vpc.amazonaws.com/efa: {{ $v.efaCount | quote }}
          hugepages-2Mi:         {{ $v.hugepages }}
          memory:                {{ $v.memory }}
        requests:
          cpu:           {{ $v.cpu | quote }}
          memory:        {{ $v.memory }}
          hugepages-2Mi: {{ $v.hugepages }}
      volumeMounts:
        - { name: gdrdrv, mountPath: /dev/gdrdrv }
        - { name: shm,    mountPath: /dev/shm }
  volumes:
    - { name: gdrdrv, hostPath: { path: /dev/gdrdrv, type: CharDevice } }
    - { name: shm,    emptyDir: { medium: Memory, sizeLimit: {{ $v.shmSize }} } }
{{- end }}
{{- end }}
