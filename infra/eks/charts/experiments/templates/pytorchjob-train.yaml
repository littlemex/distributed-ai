{{- /*
pytorchjob-train — two-node MNIST MLP DistributedDataParallel run via kubeflow.org/v1
PyTorchJob (Worker-only). Uses the Kubeflow Training Operator (installed by gpu-addons.tf)
and the ddp-sample image (ddp.py baked in; see manifests/ddp-sample/).

This is the idiomatic operator for PyTorch DDP, the same one the awsome-distributed-ai DDP
sample uses (ddp.py is adapted from it). Rendezvous matches the awsome reference: an etcd
Deployment+Service (templates/etcd.yaml) acts as the rendezvous store, and spec.elasticPolicy
points torchrun at it (rdzvBackend: etcd, rdzvHost: etcd, rdzvPort: 2379). torchrun uses etcd
to assign node ranks dynamically, then exports RANK / WORLD_SIZE / LOCAL_RANK / MASTER_ADDR /
MASTER_PORT into each training process. Worker-only (no Master/Launcher, no sshd, no Open MPI).
minReplicas==maxReplicas==workers pins the size (no autoscaling in this workshop); the etcd
rendezvous still provides value for Worker restart tolerance (maxRestarts > 0).

Backend gloo (CPU) or nccl (GPU). --nnodes and --nproc_per_node are set on the command from
Helm values (known at render time), so no $(VAR) env expansion is involved; torchrun spawns
nprocPerNode local processes per Worker and the global world size is workers*nprocPerNode.

Scaling GPUs/worker: nprocPerNode and gpu.count must move together (one proc per GPU) or
ranks silently contend for a device; ddp.py maps LOCAL_RANK to cuda:$LOCAL_RANK (one GPU/proc).

Requires the sharedStorage.backend filesystem enabled in Terraform (default openzfs → the
FSx OpenZFS static PV openzfs-shared, ON by default), cpu_nodepool_enabled=true (for the gloo
backend), and image set.

Render + apply (CPU, 2 workers):
  helm template exp ./charts/experiments --set namespace=$NS \
    --set pytorchjobTrain.enabled=true --set pytorchjobTrain.image=$IMG | kubectl apply -f -
Render + apply (GPU, 2 g5 nodes x 1 GPU):
  helm template exp ./charts/experiments --set namespace=$NS \
    --set pytorchjobTrain.enabled=true --set pytorchjobTrain.image=$IMG \
    --set pytorchjobTrain.backend=nccl --set pytorchjobTrain.nodeRole=gpu-g5 \
    --set pytorchjobTrain.gpu.enabled=true --set pytorchjobTrain.gpu.count=1 \
    --set pytorchjobTrain.nprocPerNode=1 | kubectl apply -f -
Verify:
  kubectl -n $NS get pytorchjob ddp-pytorchjob -w
  kubectl -n $NS logs -f ddp-pytorchjob-worker-0
*/ -}}
{{- if .Values.pytorchjobTrain.enabled }}
{{- $v := .Values.pytorchjobTrain }}
{{- if not $v.image }}{{ fail "pytorchjobTrain.image is required (the ddp-sample image URI)" }}{{- end }}
{{- /* The shared-claim PVC is rendered once by templates/shared-pvc.yaml (shared with
     torchrunTrain) so enabling both does not emit two copies of the same object. */ -}}
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: ddp-pytorchjob
  namespace: {{ include "experiments.namespace" . }}
spec:
  # runPolicy.cleanPodPolicy=Running keeps failed pods around for log inspection until the
  # job as a whole is deleted (on Succeeded the operator still garbage-collects the pods).
  runPolicy:
    cleanPodPolicy: Running
  # elasticPolicy: matches the awsome-distributed-ai reference (etcd rendezvous). The etcd
  # Deployment+Service is rendered by templates/etcd.yaml in the same namespace. min==max
  # pins the worker count (no autoscaling); etcd still provides restart tolerance via
  # maxRestarts (a restarted Worker re-rendezvouses without failing the whole job).
  elasticPolicy:
    rdzvBackend: etcd
    rdzvHost: etcd
    rdzvPort: 2379
    minReplicas: {{ $v.workers | default 2 | int }}
    maxReplicas: {{ $v.workers | default 2 | int }}
    maxRestarts: 100
  pytorchReplicaSpecs:
    Worker:
      replicas: {{ $v.workers | default 2 | int }}
      # OnFailure matches the awsome-distributed-ai DDP sample. With etcd rendezvous, a
      # restarted Worker re-joins via etcd (capped by elasticPolicy.maxRestarts=100).
      restartPolicy: OnFailure
      template:
        metadata:
          # The CPU NodePool consolidates underutilized nodes after 30s and can evict a Worker
          # mid-run; do-not-disrupt pins every Worker. Harmless on the GPU pools (WhenEmpty).
          annotations:
            karpenter.sh/do-not-disrupt: "true"
        spec:
          nodeSelector:
            node-role: {{ $v.nodeRole }}
          tolerations:
            - { key: capacity-reservation, operator: Exists, effect: NoSchedule }
            {{- if $v.gpu.enabled }}
            - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
            {{- end }}
          # One Worker per physical node — otherwise two Workers could land on one node and the
          # run would not exercise cross-node communication.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: { training.kubeflow.org/job-name: ddp-pytorchjob }
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: pytorch
              image: {{ $v.image }}
              # torchrun args are fully static (known at Helm render time). The operator
              # injects PET_RDZV_BACKEND=etcd and PET_RDZV_ENDPOINT=etcd:2379 from
              # spec.elasticPolicy; torchrun uses etcd to assign node ranks dynamically,
              # then exports RANK / WORLD_SIZE / LOCAL_RANK / MASTER_ADDR / MASTER_PORT
              # into each spawned training process (where ddp.py reads them).
              command:
                - torchrun
                - --nnodes={{ $v.workers | default 2 | int }}
                - --nproc_per_node={{ $v.nprocPerNode }}
                - /workspace/ddp.py
              env:
                - { name: OUTPUT_DIR, value: /shared/output/pytorchjob-{{ $v.backend }} }
              resources:
                limits:
                  {{- if $v.gpu.enabled }}
                  nvidia.com/gpu: {{ $v.gpu.count | quote }}
                  {{- end }}
                  memory: {{ $v.workerMemory }}
                requests:
                  cpu: {{ $v.workerCpu | quote }}
                  memory: {{ $v.workerMemory }}
              volumeMounts:
                - { name: shared, mountPath: /shared }
                - { name: shm, mountPath: /dev/shm }
          # No fix-perms initContainer: the ddp-sample image runs as root (uid 0), and every
          # shared backend hands root a writable mount — FSx OpenZFS exports no_root_squash
          # (openzfs.tf), FSx Lustre mounts as root, and the EFS Access Point pins posixUser 0
          # (efs.tf). ddp.py creates the MNIST data / output / snapshot dirs on first write
          # (os.makedirs), so there is nothing to pre-provision.
          volumes:
            - { name: shared, persistentVolumeClaim: { claimName: {{ include "experiments.sharedClaimName" $ }} } }
            - { name: shm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }
{{- end }}
