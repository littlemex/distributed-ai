{{- /*
trainjob-train — two-node MNIST MLP DistributedDataParallel run via Kubeflow Trainer v2
(TrainJob, trainer.kubeflow.org/v1alpha1). The v2 replacement for pytorchjob-train.yaml: the
elasticPolicy + self-hosted etcd rendezvous store both collapse into a runtimeRef one-liner.
Uses the ddp-sample image (ddp.py baked in; see manifests/ddp-sample/) and the cluster's own
runtime torch-distributed-eks (clustertrainingruntime-eks.yaml), which carries all the pod-spec
scaffolding (antiAffinity, tolerations, shared PVC, /dev/shm, do-not-disrupt).

HOW THE LAUNCH WORKS (verified against the Trainer torch plugin source, v2.2.1):
  For plain torch (non-torchtune) the plugin does NOT rewrite the command. It only injects the
  PET_* env vars — PET_NNODES / PET_NPROC_PER_NODE / PET_NODE_RANK (= JobSet completion index) /
  PET_MASTER_ADDR (= <job>-node-0-0.<job> headless DNS) / PET_MASTER_PORT — and opens the trainer
  port. So spec.trainer.command MUST invoke torchrun itself; torchrun reads those PET_* values as
  CLI defaults, which is why --nnodes / --nproc-per-node / --node-rank / --master-addr are omitted.
  Writing `command: [python, /workspace/ddp.py]` instead would bypass torchrun entirely: PET_* go
  unread, each pod runs as world_size=1, and the job "succeeds" without ever training distributed.

  numProcPerNode is set explicitly. Left unset ("auto") on a CPU node the plugin derives it from
  the CPU request (getNumCPUPerNode) — a large request would spawn dozens of procs. One proc per
  node (CPU) or one per GPU (nccl) is what we want, so we pin it.

Render + apply (CPU, 2 nodes):
  helm template exp ./charts/experiments --set namespace=$NS \
    --set trainjobTrain.enabled=true --set trainjobTrain.image=$IMG \
    --set sharedStorage.existingClaimName=shared-claim | kubectl apply -f -
Render + apply (GPU, 2 nodes x 1 GPU, long enough to watch):
  helm template exp ./charts/experiments --set namespace=$NS \
    --set trainjobTrain.enabled=true --set trainjobTrain.image=$IMG \
    --set trainjobTrain.nodeRole=gpu-ddp --set trainjobTrain.gpu.enabled=true \
    --set trainjobTrain.gpu.count=1 --set trainjobTrain.nprocPerNode=1 \
    --set trainjobTrain.totalEpochs=100 \
    --set sharedStorage.existingClaimName=shared-claim | kubectl apply -f -

  NOTE the knob is trainjobTrain.totalEpochs, NOT torchrunTrain.totalEpochs. The two workloads
  keep symmetric ddp knobs (values.yaml explains why), and passing one to the other used to be
  silently dropped — the render now fails instead (experiments.failOnStrayDdpKnobs).
Verify (JobSet-based pod naming; there is no "master"/"worker" split anymore):
  kubectl -n $NS get trainjob ddp-trainjob
  kubectl -n $NS logs -f -l jobset.sigs.k8s.io/jobset-name=ddp-trainjob   # rank-0 is node-0-0
*/ -}}
{{- if .Values.trainjobTrain.enabled }}
{{- $v := .Values.trainjobTrain }}
{{- if not $v.image }}{{ fail "trainjobTrain.image is required (the ddp-sample image URI)" }}{{- end }}
{{- include "experiments.failOnStrayDdpKnobs" (dict "root" $ "enabled" "trainjobTrain" "other" "torchrunTrain") }}
{{- $outSubdir := $v.outputSubdir | default (printf "trainjob-%s" ($v.nodeRole | default "cpu")) }}
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: ddp-trainjob
  namespace: {{ include "experiments.namespace" . }}
spec:
  runtimeRef:
    apiGroup: trainer.kubeflow.org
    kind: ClusterTrainingRuntime
    name: torch-distributed-eks
  trainer:
    numNodes: {{ $v.numNodes | default 2 | int }}
    # Explicit — never rely on "auto" (see header). IntOrString in the CRD; keep it an int here.
    numProcPerNode: {{ $v.nprocPerNode | default 1 | int }}
    image: {{ $v.image | quote }}
    # command MUST start with torchrun so the injected PET_* are honored; rendezvous args are
    # omitted on purpose (torchrun reads them from PET_*).
    command:
      - torchrun
      - /workspace/ddp.py
    resourcesPerNode:
      requests:
        cpu: {{ $v.workerCpu | default "4" | quote }}
        memory: {{ $v.workerMemory | default "16Gi" | quote }}
      limits:
        {{- if $v.gpu.enabled }}
        nvidia.com/gpu: {{ $v.gpu.count | default 1 | quote }}
        {{- end }}
        memory: {{ $v.workerMemory | default "16Gi" | quote }}
    # WHERE ddp.py's env BELONGS (verified against the Trainer torch plugin's merge, v2.2.1):
    # spec.trainer.env is merged BY NAME into the runtime container's env, with the TrainJob
    # side winning. So the ClusterTrainingRuntime is the place for cluster-lifetime defaults
    # (a namespace-wide TRACKING_URI, say, if MLflow ever becomes a standing service), and THIS
    # list is the place for per-run knobs: OUTPUT_DIR identifies the run, TOTAL_EPOCHS /
    # SAVE_EVERY / extraEnv configure it. Never set PET_* on either side — the plugin injects
    # those, and a hand-written copy would race the merge.
    #
    # OUTPUT_DIR carries a per-shape subfolder because ddp.py RESUMES from whatever snapshot it
    # finds there. With one shared "trainjob" folder, a CPU/gloo run followed by a GPU/nccl run
    # made the second one pick up the first one's epoch counter and stop almost immediately —
    # which reads as "my epoch setting was ignored" rather than "it resumed". nodeRole is the
    # closest stand-in for run shape here (cpu vs an accelerator pool); override with
    # trainjobTrain.outputSubdir to pin a folder, or to resume another run's snapshot on purpose.
    env:
      - { name: OUTPUT_DIR, value: /shared/output/{{ $outSubdir }} }
      {{- include "experiments.ddpEnv" $v | trim | nindent 6 }}
{{- end }}
