{{- /*
neuron-serving-vllm — vLLM OpenAI-compatible server on the Neuron (Trainium) pool.
Requests all Neuron devices on the node (one whole trn2). Counterpart to gpu-serving-vllm.

tensor-parallel-size = neuronServingVllm.tpSize (default 32 for trn2 = 16 devices x LNC=2).
Override for other generations.

Set `neuronCache.enabled=true` to mount the shared Neuron compile cache (EFS-backed; see the
neuronCache block in values.yaml). For gated models, add an `hf-token` secret too.

Render + apply:
  helm template exp ./charts/experiments --set namespace=$NS \
    --set neuronServingVllm.enabled=true --set neuronServingVllm.nodeRole=trn2 \
    --set neuronServingVllm.model=$MODEL \
    --set neuronCache.enabled=true --set neuronCache.create=true | kubectl apply -f -
Verify:
  kubectl -n $NS rollout status deploy/neuron-vllm --timeout=30m   # first run compiles NEFF
*/ -}}
{{- if .Values.neuronServingVllm.enabled }}
{{- $v := .Values.neuronServingVllm }}
{{- $cache := .Values.neuronCache }}
{{- include "experiments.neuronCacheValidate" $cache }}
{{- if not $v.nodeRole }}{{ fail "neuronServingVllm.nodeRole is required — set it to the accelerator_pools key of the target Neuron pool (Karpenter labels its nodes node-role=<pool key>). Without it the pod gets an empty selector, never schedules, and Karpenter keeps launching nodes trying to satisfy it." }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuron-vllm
  namespace: {{ include "experiments.namespace" . }}
  labels:
    app: neuron-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neuron-vllm
  template:
    metadata:
      labels:
        app: neuron-vllm
    spec:
      # Land on the Neuron accelerator pool (Karpenter node-role=<pool key>, NOT <pool>-serving).
      nodeSelector:
        node-role: {{ $v.nodeRole }}
      tolerations:
        {{- include "experiments.neuronTolerations" . | nindent 8 }}
      containers:
        - name: vllm
          image: {{ include "experiments.dlcImage" (dict "image" $v.image "repoTag" $v.dlcRepoTag "root" $) }}
          command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model={{ $v.model }}
            - --tensor-parallel-size={{ $v.tpSize }}   # trn2: 16 devices x LNC=2 -> 32 logical cores
            - --max-num-seqs=4
            - --max-model-len=4096
            - --device=neuron
            - --port=8000
          env:
            - { name: VLLM_NEURON_FRAMEWORK, value: "neuronx-distributed-inference" }
            {{- if $cache.enabled }}
            # Namespaced per model + TP: NEURON_COMPILED_ARTIFACTS is a per-model artifact directory
            # (not content-addressed), so multiple serving models must not share one cache root.
            - { name: NEURON_COMPILED_ARTIFACTS, value: {{ printf "%s/vllm/%s/tp%v" $cache.mountPath ($v.model | replace "/" "--") $v.tpSize | quote }} }
            {{- end }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          ports:
            - { name: http, containerPort: 8000 }
          # No hugepages request: Karpenter does not size new nodes against hugepages, so
          # requesting it on a provisioning-triggering pod makes it skip the NodeClaim.
          resources:
            limits:
              aws.amazon.com/neuron: {{ $v.neuronDevices | quote }}
              {{- if gt ($v.efaCount | int) 0 }}
              vpc.amazonaws.com/efa: {{ $v.efaCount | quote }}
              {{- end }}
              memory: {{ $v.memory }}
            requests:
              aws.amazon.com/neuron: {{ $v.neuronDevices | quote }}
              cpu: {{ $v.cpu | default "48" | quote }}
              memory: {{ $v.memory }}
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            # First run compiles the model to NEFF (many minutes); start late.
            initialDelaySeconds: 300
            periodSeconds: 15
            failureThreshold: 120
          volumeMounts:
            {{- if $cache.enabled }}
            {{- include "experiments.neuronCacheVolumeMount" $cache | nindent 12 }}
            {{- end }}
            - { name: shm, mountPath: /dev/shm }
      volumes:
        {{- if $cache.enabled }}
        {{- include "experiments.neuronCacheVolume" $cache | nindent 8 }}
        {{- end }}
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: neuron-vllm
  namespace: {{ include "experiments.namespace" . }}
  labels:
    app: neuron-vllm
spec:
  selector:
    app: neuron-vllm
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
{{- end }}
