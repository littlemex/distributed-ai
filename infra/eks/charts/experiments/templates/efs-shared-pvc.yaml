{{- /*
efs-shared-pvc — the ReadWriteMany PVC that torchrunTrain and pytorchjobTrain both bind to
the static PV `efs-neuron-workspace` (efs.tf). Split out of both templates so there is
exactly one PVC definition (rendering both workloads together used to emit two identical
PersistentVolumeClaim documents; harmless while they stayed identical, but the first one to
drift becomes a silent last-wins bug, and it invites copy-paste of a definition that should
have one source of truth).

NOTE: efs-neuron-workspace is a single static PV — it can only be Bound to ONE PVC at a
time. Applying this into a second namespace while the first PVC is still Bound leaves the
second PVC permanently Pending. Delete the first namespace's PVC first, or provision a
second static PV before running the same workload elsewhere.
*/ -}}
{{- if or .Values.torchrunTrain.enabled .Values.pytorchjobTrain.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-shared-claim
  namespace: {{ include "experiments.namespace" . }}
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: efs-neuron-workspace
  resources:
    requests:
      storage: 1000Gi
{{- end }}
