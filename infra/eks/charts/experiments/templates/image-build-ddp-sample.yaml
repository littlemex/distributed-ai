{{- /*
image-build-ddp-sample — build the workshop's ddp-sample image IN-CLUSTER with rootless BuildKit
and push to ECR, so the workshop needs no local docker/finch. This is a THIN CALLER: the actual
build/push Job is the reusable "image-builder.job" define (image-builder-lib chart);
this file supplies only ddp-sample's identity (its Job name and its git build-context sub-path).
Any other image reuses the same builder with its own thin caller (own jobName / contextSubPath),
instead of copying this template. The Terraform "mechanism" half (ECR repo, IAM role, Pod Identity,
image-builder namespace + SA) is unchanged (image-builder.tf, image_builder_enabled=true by default).

Render + apply (repository from `terraform output -raw ddp_sample_ecr_url`):
  helm template exp ./charts/experiments \
    -s templates/image-build-ddp-sample.yaml \
    --set imageBuild.enabled=true \
    --set imageBuild.repository=$ECR_URL --set imageBuild.tag=v1 | kubectl apply -f -
  kubectl -n image-builder wait --for=condition=complete job/build-ddp-sample-v1 --timeout=30m
  kubectl -n image-builder logs -f job/build-ddp-sample-v1              # build (main container)
  kubectl -n image-builder logs job/build-ddp-sample-v1 -c ecr-login   # if the init step failed

Re-building the SAME tag: delete the completed Job first
  kubectl -n image-builder delete job build-ddp-sample-{{ .Values.imageBuild.tag }} --ignore-not-found
(or just bump the tag — recommended, avoids the :latest/kubelet-cache trap).

Build context: this Job fetches the ddp-sample directory straight from the repo via BuildKit's git
context (contextSource=git, the default). For an ad-hoc/experiment image whose context is not in a
repo, the underlying builder also supports contextSource=configMap — see _image-build.tpl and the
image builder docs (docs/image-builder.md); that is not ddp-sample's path.
*/ -}}
{{- /* Renders only when imageBuild.jobName is EMPTY. jobName is the selector between this caller and
     the generic image-build-custom.yaml: the two are mutually exclusive on jobName, so a full render
     (no -s) with --set imageBuild.jobName=... produces exactly one Job (the custom one), never this
     one too. Default jobName is empty, so the ddp-sample build and its byte-identical render are
     unchanged. */ -}}
{{- if and .Values.imageBuild.enabled (not .Values.imageBuild.jobName) }}
{{- /* ddp-sample's identity: its Job name and where its Dockerfile lives in this repo. Everything
     else (repository, tag, gitRef, context source, ...) comes from imageBuild values. */ -}}
{{- $args := deepCopy .Values.imageBuild -}}
{{- $_ := set $args "jobName" "build-ddp-sample" -}}
{{- $_ := set $args "contextSubPath" (.Values.imageBuild.contextSubPath | default "infra/eks/manifests/ddp-sample") -}}
{{- include "image-builder.job" $args }}
{{- end }}
