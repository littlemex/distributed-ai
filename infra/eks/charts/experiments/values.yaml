# values.yaml — distributed-ai EKS experiment workloads.
#
# Every workload is OFF by default. Turn on exactly the one you want and render it:
#
#   helm template exp ./charts/experiments \
#     --set namespace=my-ns --set neuronDdp.enabled=true \
#     | kubectl apply -f -
#
# Defaults reflect values VERIFIED on this cluster (trn2.48xlarge x2, g5, p5en);
# override per run with --set. Nothing here is region- or account-specific except the
# example image URIs, which you should replace with your own ECR / pinned tags.

# Namespace every rendered object is placed in. Create it first: kubectl create ns <x>
# (this chart does not create the Namespace itself, so the same render can target a
# pre-existing one). Leave "" (the default) to use whatever `-n <x>` you pass to
# `helm template`; set --set namespace=<x> only if you want to override that.
# IMPORTANT: do not default this to a literal namespace name (e.g. "default") — a non-empty
# value here always wins over `-n`, so `helm template exp . -n foo` would silently render
# into the wrong namespace with no error.
namespace: ""

# ─────────────────────────────────────────────────────────────────────────────
# dlc — AWS Deep Learning Containers registry, factored out of the per-workload image URIs.
# The DLC ECR account ID is REGION-SPECIFIC (a table AWS publishes; 763104351884 serves
# us-east-2 among others), so a full image URI hardcodes region+account knowledge in every
# workload. Defining the registry once here means a cross-region user changes ONE line, and
# the Neuron workloads below build their image as "{dlc.registry}/{repo}:{tag}".
# Confirm your region's account ID and the tag with:
#   aws ecr describe-images --registry-id <id> --repository-name <repo> --region <region>
# See https://github.com/aws/deep-learning-containers/blob/master/available_images.md
dlc:
  registry: 763104351884.dkr.ecr.us-east-2.amazonaws.com

# ─────────────────────────────────────────────────────────────────────────────
# topologyPresets — per-instance-type physical topology, as STRUCTURED DATA rather than a
# table buried in a comment (a commented table is never validated and rots). These are the
# reference values for setting the accelerator workloads' per-instance knobs; copy the row
# for your instance type into the workload's fields (neuronDdp / ncclSshd / neuronServingVllm).
# ALWAYS confirm on a live node before trusting a row — these are physical facts, not spec-sheet
# promises:
#   neuronDevices: `neuron-ls` row count             gpuCount: nvidia-smi -L count
#   efaCount     : allocatable vpc.amazonaws.com/efa (schedulable = physical cards - 1; card 0 = node IP)
#   lnc          : Neuron logical-core config (trn2=2, trn1/inf2=1)
#   nprocPerNode : (neuronDevices x cores/device) / lnc
# "verified" = confirmed end-to-end on this project's clusters; "untested" = reference only.
neuronTopologyPresets:
  trn2.48xlarge: { neuronDevices: 16, efaCount: 15, lnc: 2, nprocPerNode: 32, status: verified }
  trn1.32xlarge: { neuronDevices: 16, efaCount: 8,  lnc: 1, nprocPerNode: 32, status: untested }
  inf2.48xlarge: { neuronDevices: 12, efaCount: 1,  lnc: 1, nprocPerNode: 24, status: untested }
gpuTopologyPresets:
  # gpuProduct is the nvidia.com/gpu.product node label; efaCount is the full multi-card count
  # for an inter-node NCCL bench (not schedulable-minus-1, which only applies to EFA requests).
  g5.24xlarge:   { gpuProduct: NVIDIA-A10G,          gpuCount: 4, efaCount: 0,  status: verified }
  p5en.48xlarge: { gpuProduct: NVIDIA-B300-SXM6-AC,  gpuCount: 8, efaCount: 16, status: untested }

# ─────────────────────────────────────────────────────────────────────────────
# 0) imageBuild — build ddp-sample IN-CLUSTER with Kaniko and push to ECR (no local
#    docker/finch). The ECR repo + IAM + Pod Identity are provisioned by Terraform
#    (image-builder.tf, image_builder_enabled=true by default). This renders a one-shot
#    Kaniko Job in the "image-builder" namespace; auth is via Pod Identity (settings-free).
#    Set repository from `terraform output -raw ddp_sample_ecr_url`.
# ─────────────────────────────────────────────────────────────────────────────
imageBuild:
  enabled: false          # like every catalog workload, opt in with --set
  repository: ""          # REQUIRED: terraform output -raw ddp_sample_ecr_url
  tag: v1                 # bump (v1→v2) to rebuild instead of deleting the Job
  jobName: ""             # Job name <jobName>-<tag>; REQUIRED only for the generic image-build-custom.yaml
                          # caller. image-build-ddp-sample.yaml sets its own (build-ddp-sample); ignored there.
  # Build context source: "git" (default) clones gitRepo#gitRef; "configMap" builds from a ConfigMap
  # staged into an emptyDir (no clone, no git push) — for ad-hoc/experiment images. An unknown value
  # is a hard error (never a silent git fallback). The configMap path has flat-key/~1 MiB/0644
  # constraints and trades away provenance + git-side controls (ConfigMap-create in the namespace
  # becomes ECR-push-equivalent) — keep production images on git. Full design, constraints, and
  # trade-offs: docs/image-builder.md.
  contextSource: git
  contextConfigMap: ""    # ConfigMap name holding Dockerfile + context (contextSource=configMap)
  filename: Dockerfile    # Dockerfile name within the context (either source)
  gitRepo: github.com/littlemex/distributed-ai.git
  gitRef: main            # pin to a release tag/sha for reproducibility; main is for iteration
  region: us-west-2       # ECR region for the initContainer's `aws ecr get-login-password`
  namespace: image-builder
  serviceAccountName: image-builder
  # Peak build disk ~= pushed image size x4-5. Guide: 3GB→30Gi (default), 10GB→60Gi,
  # 25GB→150Gi (+ dedicatedPool). Must be <= the target node's allocatable ephemeral-storage.
  ephemeralStorage: 30Gi
  # zstd-compress the layers THIS build adds (the external base layers keep their original
  # compression and digests, so sharing and cache hits survive). Off by default: it trades push
  # time and CPU for faster decompression on the node, which only pays off when a cold pull is
  # dominated by unpacking rather than downloading. Measure first — the image-cache chapter shows
  # how to split a cold pull into fetch and unpack before turning this on.
  zstd: false
  dedicatedPool:
    # true → schedule onto the tainted NVMe-RAID0 builder pool (needs Terraform
    # image_builder_dedicated_pool=true). Use for large images the 150Gi CPU root can't hold.
    enabled: false
  # buildkitImage / awsCliImage: override only to bump the builder or the ECR-login helper image.
  # Both are pinned by digest in the template (reproducibility). BuildKit is rootless (no
  # privileged container); the aws-cli initContainer mints the ECR token into a config.json.

# ─────────────────────────────────────────────────────────────────────────────
# 1) neuronProbe — single-node Neuron (Trainium/Inferentia) sanity probe.
#    Confirms the pod lands on a Neuron node, the device plugin advertises
#    aws.amazon.com/neuron, and neuron-ls enumerates the devices.
# ─────────────────────────────────────────────────────────────────────────────
neuronProbe:
  enabled: false
  # Karpenter labels each node node-role=<accelerator_pools key>; set this to that key.
  nodeRole: trn2
  # DLC image = {dlc.registry}/{dlcRepoTag}. Set `image` to a full URI to override entirely.
  #
  # The SDK in the tag must NOT be newer than the Neuron driver in the node AMI. sdk2.30 ships
  # runtime 2.32.31, and against the driver 2.29 in the EKS Neuron AL2023 AMI
  # (amazon-eks-node-al2023-x86_64-neuron-1.35-v20260728) nrt_init gets through HBM
  # initialization and then fails in dmem_buf_copyin — a zerocopy ioctl ABI mismatch, not a
  # resource shortage. Confirmed on trn2.3xlarge, 2026-08-02: sdk2.30 fails with NRT_FAILURE,
  # sdk2.29.1 runs a matmul correctly with no optimization disabled. Check the AMI's driver
  # before bumping this:
  #   NEURON_RT_LOG_LEVEL=INFO python -c 'import torch_xla.core.xla_model as xm; xm.xla_device()' \
  #     2>&1 | grep -i "neuron driver"
  # Confirm available tags with:
  #   aws ecr describe-images --registry-id <dlc account> \
  #     --repository-name pytorch-inference-neuronx --region <region>
  dlcRepoTag: pytorch-inference-neuronx:2.9.0-neuronx-py312-sdk2.29.1-ubuntu24.04
  image: ""
  # Minimal claim: one device + one EFA is enough to prove scheduling + enumeration.
  # (Do NOT request hugepages on a probe that triggers Karpenter provisioning — Karpenter
  # does not size new nodes against hugepages and reports "no instance type has enough
  # resources", so the NodeClaim is never created. Verified on trn2.48xlarge.)
  neuronDevices: 1
  efaCount: 1

# ─────────────────────────────────────────────────────────────────────────────
# 2) neuronDdp — two-node Neuron multi-node DDP over EFA (torch-neuronx).
#    Renders a ConfigMap (allreduce_test.py), a server pod and a client pod on two
#    different nodes (podAntiAffinity), each with persistent sshd on port 2222.
#    VERIFIED on trn2.48xlarge x2: single-node (32 logical cores) and two-node
#    (world_size=64) all-reduce, plus the aws-neuron-samples MNIST MLP DDP.
# ─────────────────────────────────────────────────────────────────────────────
neuronDdp:
  enabled: false
  nodeRole: trn2
  # DLC image = {dlc.registry}/{dlcRepoTag}; set `image` to a full URI to override.
  dlcRepoTag: pytorch-inference-neuronx:2.9.0-neuronx-py312-sdk2.29.1-ubuntu24.04
  image: ""
  # Per-instance topology. Defaults below are the trn2.48xlarge row of neuronTopologyPresets
  # (top of this file); for another instance type copy that type's row here. CONFIRM on a live
  # node before trusting any row (neuron-ls / allocatable efa) — these are physical facts.
  neuronDevices: 16
  efaCount: 15
  lnc: 2
  nprocPerNode: 32
  # hugepages-2Mi request. 32Gi verified for trn2 2-node DDP; true minimum unmeasured.
  # The Neuron runtime uses 2Mi hugepages for DMA / EFA. The node AMI must reserve them
  # (vm.nr_hugepages) or the pod stays Pending on hugepages.
  hugepages: 32Gi
  memory: 384Gi
  cpu: "40"
  shmSize: 32Gi
  # EFA libfabric env. Leave on; these make NCCL/Neuron pick EFA and be fork-safe.
  efaEnv: true
  # Print libfabric provider-selection logs (proves "Opened fabric: efa-direct").
  fiLogInfo: false
  # zerocopy ABI-skew workaround. Enable ONLY if nrt_init dies with
  # "ucode_lib_ll_create failed, error: 6" — the host aws-neuronx-dkms and the
  # in-container Neuron runtime disagree on the zerocopy ioctl struct size. The real
  # fix is to align the node AMI's driver with the DLC's Neuron SDK; this just bypasses
  # the fast path. Off by default so it does not silently hide version skew.
  disableZerocopy: false

# ─────────────────────────────────────────────────────────────────────────────
# 3) ncclProbe — single-node NVIDIA/CUDA sanity probe (opens a CUDA context).
# ─────────────────────────────────────────────────────────────────────────────
ncclProbe:
  enabled: false
  # REQUIRED (no default): the accelerator_pools key of the target GPU pool. Karpenter labels
  # its nodes node-role=<key> AT LAUNCH, so this is a selector Karpenter can satisfy by
  # provisioning. This probe used to pin on nvidia.com/gpu.product to match a GPU SKU, which
  # cannot work: that label is applied by the GPU Operator only after a node is already running,
  # so Karpenter rejects the pod ("label nvidia.com/gpu.product does not have known values")
  # and it stays Pending forever. Confirmed on p4d.24xlarge, 2026-08-02.
  nodeRole: ""
  image: public.ecr.aws/hpc-cloud/nccl-tests:latest
  # Mount /dev/gdrdrv. Requires the gdrcopy kernel module, which the GPU Operator installs only
  # under gpu_operator_enable_gdrcopy=true (OFF by default in gpu-addons.tf). Leave false unless
  # that is enabled: a hostPath for a missing device node blocks the pod on
  # "hostPath type check failed" indefinitely.
  gdrcopy: false

# ─────────────────────────────────────────────────────────────────────────────
# 4) ncclSshd — two-node NVIDIA NCCL all_reduce bench over EFA (sshd + mpirun).
#    VERIFIED on p4d.24xlarge x2 (Capacity Block, us-west-2d, 2026-08-02): 2-node/16-rank
#    all_reduce_perf reported "NET/OFI Selected provider is efa (found 3 nics)" and 58.0 GB/s
#    busbw at 1 GB, against 227.1 GB/s single-node NVLink. gpuCount/efaCount below are that
#    run's values — they are per-instance-type facts, so read them off a live node of YOUR pool
#    rather than trusting the defaults (the schedulable EFA count is physical cards minus one:
#    p4d 3, p5en 15, p5 31).
# ─────────────────────────────────────────────────────────────────────────────
ncclSshd:
  enabled: false
  # REQUIRED (no default): the accelerator_pools key of the target GPU pool. Karpenter labels
  # its nodes node-role=<key> AT LAUNCH, so this is a selector Karpenter can satisfy by
  # provisioning. Do NOT select on nvidia.com/gpu.product: that label appears only after the
  # GPU Operator labels an already-running node, so Karpenter cannot use it to pick an instance
  # type and leaves the pods Pending forever.
  nodeRole: ""
  image: public.ecr.aws/hpc-cloud/nccl-tests:latest
  # gpuCount/efaCount are per-instance-type physical facts — there is no safe default across
  # families (EFA schedulable is cards-1: p4d 3, p5en 15, p5 31). Read them off a live node of
  # the target pool rather than copying a row:
  #   kubectl get nodes -l node-role=<pool> -o jsonpath=\
  #     "{.items[0].status.allocatable['nvidia\.com/gpu']}/{.items[0].status.allocatable['vpc\.amazonaws\.com/efa']}"
  # or: terraform output accelerator_pool_efa_schedulable
  gpuCount: 8       # GPUs per node
  efaCount: 3       # EFA ENIs per node (schedulable count = physical cards - 1; p4d.24xlarge)
  hugepages: 8Gi
  memory: 128Gi
  cpu: "16"
  shmSize: 16Gi
  # Mount /dev/gdrdrv into the bench pods. Requires the gdrdrv kernel module, which the GPU
  # Operator installs only when gpu_operator_enable_gdrcopy=true (OFF by default in
  # gpu-addons.tf — gdrcopy is a GPUDirect latency optimization, not needed for NCCL). Leave
  # false unless that is enabled: a hostPath for a device node that does not exist makes the
  # kubelet block on "hostPath type check failed" and the pods never start.
  gdrcopy: false

# ─────────────────────────────────────────────────────────────────────────────
# sharedStorage — the /shared RWX mount for torchrunTrain + trainjobTrain. Selects which
# Terraform-managed static PV the shared-claim PVC binds to. The three backends map to the
# three storage layers (see infra/eks/openzfs.tf / fsx.tf / efs.tf):
#   openzfs → FSx OpenZFS single-AZ NFS home/general-shared (openzfs_enabled, ON by default)
#   fsx     → FSx Lustre single-AZ high-throughput scratch  (fsx_enabled, ON by default)
#   efs     → EFS regional multi-AZ RWX                       (efs_enabled, DEMOTED/off)
# The chosen backend's var.<x>_enabled must be true in Terraform so its PV exists, else the
# PVC stays Pending. Default openzfs matches the awsome-distributed-ai home-on-OpenZFS layout.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# 5) torchrunTrain — single-node MNIST MLP DDP via `torchrun` (batch/v1 Job).
#    Backend gloo (CPU) or nccl (GPU). Requires sharedStorage.backend enabled (default
#    openzfs, ON) and the ddp-sample image.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# ncclTrainjob — multi-node NCCL/EFA bandwidth check via Kubeflow Trainer v2 (no ssh).
#
# Preferred over ncclSshd. Same question answered ("is EFA carrying the collectives, and at what
# bandwidth"), but the rendezvous comes from TrainJob instead of mpirun-over-ssh, so there is no
# sshd, no keypair, no privileged container, and a failure shows up as a pod/event the cluster can
# report. See the template header for what the numbers do and do not mean.
# ─────────────────────────────────────────────────────────────────────────────
ncclTrainjob:
  enabled: false
  # REQUIRED: the accelerator_pools key of the target GPU pool (Karpenter labels its nodes
  # node-role=<key> at launch, so it is a selector Karpenter can satisfy by provisioning).
  nodeRole: ""
  # REQUIRED: an image carrying BOTH torchrun and the aws-ofi-nccl plugin. Two images already in
  # this chart look like candidates and are not:
  #   - the nccl-tests image (used by ncclSshd) is built around Open MPI and has no torch, so the
  #     pods fail immediately with "exec: torchrun: executable file not found in $PATH"
  #   - the ddp-sample image is the plain pytorch base with no EFA plugin, so NCCL finds no EFA
  #     provider and quietly uses TCP sockets — the run passes and measures the wrong fabric
  # An AWS Deep Learning Container ships both. List the available tags with:
  #   aws ecr describe-images --registry-id 763104351884 --repository-name pytorch-training \
  #     --query 'sort_by(imageDetails,&imagePushedAt)[-20:].imageTags[]' --output text | tr '\t' '\n'
  #   763104351884.dkr.ecr.<region>.amazonaws.com/pytorch-training:2.10.0-gpu-py313-cu130-ubuntu22.04-ec2-v1.11
  image: ""
  # REQUIRED, both of them: per-instance facts. Read them off a live node instead of hardcoding —
  # the schedulable EFA count is the physical card count minus one (card 0 carries the node IP) and
  # differs per family, so a fixed value silently leaves the pod Pending on another instance type.
  #   GPU=$(kubectl get nodes -l node-role=$POOL \
  #     -o jsonpath="{.items[0].status.allocatable['nvidia\.com/gpu']}")
  #   EFA=$(kubectl get nodes -l node-role=$POOL \
  #     -o jsonpath="{.items[0].status.allocatable['vpc\.amazonaws\.com/efa']}")
  gpuCount: ""
  efaCount: ""
  numNodes: 2
  cpu: "8"
  memory: 64Gi
  # Message sizes (MiB) and iterations. Small sizes measure latency, not fabric bandwidth; keep at
  # least one size in the hundreds of MiB for the bandwidth figure to mean anything.
  sizesMb: "512,1024"
  iters: 20
  # Per-workload override of the chart-wide ncclSocketIfname below. Empty = use that default.
  socketIfname: ""
  # Copies bench.py onto the shared RWX volume (the runtime mounts /shared, not ConfigMaps).
  stageImage: public.ecr.aws/docker/library/busybox:1.36

# NCCL's own socket bootstrap interface filter, shared by every NCCL workload here
# (ncclProbe, ncclSshd, ncclTrainjob) so the pattern lives in exactly one place. The default
# excludes loopback and the CNI-side interfaces. Worth being explicit on EKS: the Pod Identity
# agent puts an IDENTICAL link-local address on every node, so letting auto-detection choose can
# pick an address that resolves to the wrong host. Note this is an EXCLUDE pattern (leading "^"):
# naming efa0,efa1,... instead fails the rendezvous, because efa-only interfaces carry no IP.
ncclSocketIfname: "^lo,docker,veth"

sharedStorage:
  # backend is informational only now (see existingClaimName below) — it used to select which
  # static PV the chart's own shared-claim PVC bound to. Kept as a comment anchor for
  # manifests/shared-pvc.yaml's `terraform output shared_storage` lookup; not read by any
  # template.
  backend: openzfs      # openzfs | fsx | efs
  # REQUIRED. The chart does NOT create this PVC — apply manifests/shared-pvc.yaml once per
  # namespace (by hand, outside any workload's render cycle) and pass its name here. This is
  # not a convenience knob: a chart-rendered PVC's lifecycle would be tied to however many
  # times a workload gets re-applied (a `helm template | kubectl apply` re-run, a namespace
  # teardown, a `helm uninstall`), while the static PV it binds to is Terraform-managed and
  # outlives all of that. Deleting and recreating a same-named PVC gets a NEW UID that the
  # PV's claimRef does not recognize, and the PV gets stuck Released — see
  # manifests/shared-pvc.yaml's header and templates/_helpers.tpl's sharedClaimName comment
  # for the full mechanism.
  existingClaimName: ""  # e.g. "shared-claim"
torchrunTrain:
  enabled: false
  # "gloo" or "nccl" — LABEL ONLY. This value is not read by torch.distributed; it only
  # names the OUTPUT_DIR subfolder (/shared/output/torchrun-<backend>) so gloo/nccl runs
  # don't clobber each other's snapshots. The actual backend ddp.py picks is determined by
  # whether a GPU is visible (gpu.enabled below + the pod's nvidia.com/gpu request), not by
  # this string. Set it to describe what you're actually running; setting backend=nccl
  # without gpu.enabled=true does NOT make it use nccl.
  backend: gloo
  nodeRole: cpu
  # torchrun --nproc_per_node. MUST equal the GPU count on the nccl backend (one proc
  # per GPU); on gloo it is just the CPU process count (2 is a fine default).
  nprocPerNode: 2
  gpu:
    enabled: false     # set true for the nccl backend
    count: 1           # nvidia.com/gpu per pod; keep == nprocPerNode on GPU
  # REQUIRED. Build from infra/eks/manifests/ddp-sample/ and push to your ECR:
  #   export IMG=$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/ddp-sample:$(git rev-parse --short HEAD)
  #   docker build -t $IMG infra/eks/manifests/ddp-sample/ && docker push $IMG
  # Then pass --set torchrunTrain.image=$IMG
  image: ""
  # ── ddp.py knobs ─────────────────────────────────────────────────────────────
  # These three exist under BOTH torchrunTrain and trainjobTrain, with identical names, on
  # purpose. They configure ddp.py (the script) rather than the launcher, so a single shared
  # `ddp.*` block was considered and rejected: it would break the one rule this catalog
  # otherwise keeps — everything that affects workload X lives under X — and readers would
  # have to remember which knobs live where. The real risk of duplicating them (updating one
  # workload's env injection and forgetting the other, which is exactly how trainjobTrain
  # shipped with no TOTAL_EPOCHS at all and silently ignored a --set) is eliminated on the
  # TEMPLATE side instead: both workloads render these through the single experiments.ddpEnv
  # helper in _helpers.tpl. Keeping the names identical also lets a values file that
  # configures both workloads DRY itself with a plain YAML anchor.
  #
  # ddp.py's own default (3 epochs) finishes in seconds — set this for a run long enough to
  # actually watch (e.g. 100). "" leaves ddp.py's default alone.
  totalEpochs: ""
  # ddp.py checkpoints every N epochs on rank 0 only. "" leaves ddp.py's default (1) alone —
  # every epoch. Killing the Job mid-run keeps the snapshot from the last epoch that finished.
  saveEvery: ""
  # Long-tail ddp.py env (BATCH_SIZE, USE_MLFLOW, TRACKING_URI, DATA_DIR, ...). A k8s-style
  # name/value list rather than a map: it lands in the container spec verbatim, so the
  # values→manifest correspondence stays readable. Only the two knobs above get dedicated
  # fields — they are the ones every chapter tells you to touch, so they earn the
  # discoverability; a dedicated field per env var would just re-document ddp.py here.
  #   extraEnv:
  #     - { name: BATCH_SIZE, value: "64" }
  extraEnv: []
  memory: 16Gi
  cpu: "4"

# ─────────────────────────────────────────────────────────────────────────────
# 6) trainjobTrain — multi-node MNIST MLP DDP via Kubeflow Trainer v2 TrainJob
#    (trainer.kubeflow.org/v1alpha1), on the cluster runtime torch-distributed-eks. The v2
#    successor to the old kubeflow.org/v1 PyTorchJob: rendezvous is torchrun c10d on node-0
#    (PET_* injected by the plugin), so no self-hosted etcd. Nodes on nodeRole (cpu for gloo,
#    an accelerator pool for nccl). Requires the Trainer control plane (trainer.tf,
#    trainer_enabled=true) + sharedStorage.backend enabled (default openzfs, ON).
# ─────────────────────────────────────────────────────────────────────────────
trainjobTrain:
  enabled: false
  # Kubeflow Trainer v2 TrainJob (trainer.kubeflow.org/v1alpha1) — the multi-node successor to the
  # old pytorchjobTrain (PyTorchJob). References the cluster runtime torch-distributed-eks, which
  # holds the antiAffinity / tolerations / shared PVC / shm / do-not-disrupt scaffolding; this
  # block sets only the per-job knobs.
  numNodes: 2          # training nodes; the torch plugin injects PET_NNODES = this
  nodeRole: cpu        # accelerator_pools key (cpu for gloo DDP; e.g. gpu-ddp for nccl)
  # processes PER node. Set explicitly — never "auto" (on CPU the plugin would derive it from the
  # CPU request). Keep == gpu.count on GPU (one proc per GPU); 1 on CPU.
  nprocPerNode: 1
  gpu:
    enabled: false     # set true for the nccl (GPU) backend
    count: 1           # nvidia.com/gpu per node; keep == nprocPerNode on GPU
  image: ""            # REQUIRED: same ddp-sample image as torchrunTrain
  # ── ddp.py knobs ─────────────────────────────────────────────────────────────
  # Same three knobs as torchrunTrain, same names, same semantics — see the comment there for
  # why they are duplicated per workload instead of shared, and how the template side keeps
  # them from drifting. Until these existed, --set torchrunTrain.totalEpochs=100 was silently
  # dropped on a trainjobTrain run and the job trained for ddp.py's default 3 epochs.
  totalEpochs: ""
  saveEvery: ""
  extraEnv: []
  # OUTPUT_DIR subfolder under /shared/output. Distinct per run shape because ddp.py RESUMES
  # from whatever snapshot it finds there: a gloo (CPU) run and an nccl (GPU) run sharing one
  # folder means the second one picks up the first one's epoch counter and stops early, which
  # looks like the epoch setting being ignored. torchrunTrain splits on its `backend` label
  # for the same reason; here nodeRole is the closest stand-in (cpu vs an accelerator pool).
  # Override to pin a run to its own folder, or to deliberately resume another run's snapshot.
  outputSubdir: ""
  workerMemory: 16Gi
  workerCpu: "4"
  shmSize: 4Gi         # /dev/shm emptyDir sizeLimit in the runtime

# ─────────────────────────────────────────────────────────────────────────────
# 7) gpuServingVllm — single-GPU vLLM OpenAI-compatible serving Deployment + Service.
# ─────────────────────────────────────────────────────────────────────────────
gpuServingVllm:
  enabled: false
  # REQUIRED: the accelerator_pools key of the target GPU pool (Karpenter labels its nodes
  # node-role=<key>). No default that looks plausible — "gpu-g5" used to sit here and names a
  # pool this module never creates, so the deployment stayed Pending and Karpenter kept adding
  # nodes trying to satisfy it.
  nodeRole: ""
  model: NousResearch/Meta-Llama-3-8B-Instruct
  # Pin to a released tag (or digest) for reproducibility; :latest changes under you between
  # runs. vllmRay below pins v0.6.3.post1 — pick a tag you have verified for your model.
  image: vllm/vllm-openai:v0.6.3.post1
  gpuCount: 1
  # memory is used for BOTH requests and limits, and shmSize below is an
  # emptyDir{medium: Memory} that counts against the SAME container memory limit. The pod's real
  # demand is memory + shmSize, so both must fit the smallest node the pool can pick. Getting
  # this wrong does not just leave the pod Pending: the scheduler reports insufficient memory,
  # Karpenter reads that as "add a bigger node", and since no instance type in the pool is big
  # enough it launches node after node — 11 spot nodes were observed for a single replica before
  # the run was stopped (2026-08-03). Check with:
  #   kubectl get nodes -l node-role=<pool> -o custom-columns=\
  #     'TYPE:.metadata.labels.node\.kubernetes\.io/instance-type,MEM:.status.allocatable.memory'
  # Verified: memory=8Gi + shmSize=2Gi fits a g6.xlarge (12925972Ki ~= 12.3Gi allocatable).
  memory: 48Gi
  # CPU request. Keep well below the pool's smallest node's allocatable so the pod
  # schedules: a g6.2xlarge/g5.2xlarge (8 vCPU) has ~7.9 allocatable after kube/system
  # reserved, so a hard cpu=8 request never fits. Small ungated models (Qwen2.5-0.5B)
  # run fine on 2 vCPU. Override per pool as needed.
  cpu: "2"
  # Serving knobs. Defaults match the previously hardcoded template values, so leaving them
  # unset renders identically; override per model/instance.
  #   maxModelLen: context window vLLM allocates KV cache for. Larger models/longer contexts
  #     need more; too large for the GPU's memory makes vLLM fail to start.
  #   gpuMemoryUtilization: fraction of GPU memory vLLM may claim (0-1). Lower it if the node
  #     runs other GPU work; raise toward 0.9 to fit a bigger model.
  #   port: container + service port. Single knob so the arg and the Service can't drift.
  #   readiness*: a large model's weights can take minutes to load; the defaults tolerate
  #     ~15 min (initialDelay 60 + period 10 x failureThreshold 90). Shrink for small models.
  #   shmSize: /dev/shm for NCCL/vLLM; raise for tensor-parallel across many GPUs.
  maxModelLen: 4096
  gpuMemoryUtilization: "0.85"
  port: 8000
  readinessInitialDelaySeconds: 60
  readinessPeriodSeconds: 10
  readinessFailureThreshold: 90
  shmSize: 8Gi

# ─────────────────────────────────────────────────────────────────────────────
# 8) neuronServingVllm — Neuron vLLM serving Deployment + Service (whole trn2 node).
# ─────────────────────────────────────────────────────────────────────────────
neuronServingVllm:
  enabled: false
  nodeRole: trn2
  model: NousResearch/Meta-Llama-3-8B-Instruct
  # DLC image = {dlc.registry}/{dlcRepoTag}; set `image` to a full URI to override.
  dlcRepoTag: huggingface-vllm-inference-neuronx:0.11.0-optimum0.4.5-neuronx-py310-sdk2.26.1-ubuntu22.04
  image: ""
  neuronDevices: 16
  # tensor-parallel-size = logical NeuronCores. trn2: 16 devices x LNC=2 = 32.
  tpSize: 32
  # This is single-node tensor-parallel serving: all NeuronCores talk over on-chip NeuronLink,
  # not EFA (EFA is for INTER-node traffic). Do not copy neuronDdp's efaCount here — that
  # pool's own comment says schedulable EFA = physical cards - 1 (15 on trn2.48xlarge); this
  # workload requesting 16 would make it permanently Unschedulable against that same
  # allocatable, for a resource it does not even use. Bump above 0 only if you multi-node this
  # (untested — no CB available to verify at review time).
  efaCount: 0
  memory: 512Gi

# ─────────────────────────────────────────────────────────────────────────────
# 8b) neuronVllmPlugin — Neuron serving via the vLLM Neuron plugin (Deployment + Service).
# ─────────────────────────────────────────────────────────────────────────────
# The modern, plugin-based path (distinct from neuronServingVllm above, which is the legacy
# optimum-neuron/NxDI DLC). Uses the vLLM Neuron plugin DLC; the plugin auto-selects the neuron
# platform once the pod has a Neuron device. This is what Basic09 uses. Configurable per model.
neuronVllmPlugin:
  enabled: false
  # Optional: the accelerator_pools key of the target Neuron pool (Karpenter labels its nodes
  # node-role=<key>). Leave "" to rely solely on the device request below to land on the Neuron
  # node. A Karpenter-managed reserved pool DOES carry node-role=<key>, so pass it when more than
  # one Neuron pool exists; "" is fine when the cluster has exactly one.
  nodeRole: ""
  model: Qwen/Qwen3-VL-4B-Instruct
  image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.21.0.1.0.0-neuronx-py313-sdk2.31.0-ubuntu24.04
  # Request the whole Trainium DEVICE (aws.amazon.com/neuron), NOT individual neuroncores: a
  # neuroncore request injects NEURON_RT_VISIBLE_CORES, which the plugin's tensor-parallel
  # (multiprocessing) worker rejects. neuronDevices maps to the aws.amazon.com/neuron request.
  neuronDevices: 1
  # tensor-parallel-size = logical NeuronCores. trn2.3xlarge with LNC=2 exposes 4 logical cores;
  # if a node advertises aws.amazon.com/neuroncore: 8 (LNC=1), set this to 8.
  tpSize: 4
  maxModelLen: 8192
  maxNumSeqs: 4
  cpu: "8"
  memoryRequest: 24Gi
  # memory is the container limit; keep headroom for the first-run NEFF compile fork.
  memory: 96Gi
  port: 8000
  # vLLM's compile cache (NEFF on Neuron). emptyDir here; point at a PVC to persist across pods.
  cacheRoot: /work/neuron_cache
  shmSize: 8Gi
  # First run pulls a multi-GB DLC, downloads the model, and compiles to NEFF — beyond the default
  # 600s Deployment progress deadline. readiness tolerates ~1h; the deadline caps the whole rollout.
  progressDeadlineSeconds: 2400
  readinessInitialDelaySeconds: 120
  readinessPeriodSeconds: 15
  readinessFailureThreshold: 240

# ─────────────────────────────────────────────────────────────────────────────
# 9) vllmRay — two-node tensor-parallel vLLM over a Ray head+worker (GPU).
# ─────────────────────────────────────────────────────────────────────────────
vllmRay:
  enabled: false
  nodeRole: ""
  model: NousResearch/Meta-Llama-3-8B-Instruct
  image: vllm/vllm-openai:v0.6.3.post1
  gpuCount: 1
  # memory is used for BOTH requests and limits, and shmSize below is an
  # emptyDir{medium: Memory} that counts against the SAME container memory limit. The pod's real
  # demand is memory + shmSize, so both must fit the smallest node the pool can pick. Getting
  # this wrong does not just leave the pod Pending: the scheduler reports insufficient memory,
  # Karpenter reads that as "add a bigger node", and since no instance type in the pool is big
  # enough it launches node after node — 11 spot nodes were observed for a single replica before
  # the run was stopped (2026-08-03). Check with:
  #   kubectl get nodes -l node-role=<pool> -o custom-columns=\
  #     'TYPE:.metadata.labels.node\.kubernetes\.io/instance-type,MEM:.status.allocatable.memory'
  # Verified: memory=8Gi + shmSize=2Gi fits a g6.xlarge (12925972Ki ~= 12.3Gi allocatable).
  memory: 48Gi

# ─────────────────────────────────────────────────────────────────────────────
# 10) prewarm — keep each pool's node-local image cache warm (Advanced01).
#
# Keyed by accelerator_pools key (= the node-role label Karpenter stamps), so a pool only
# warms the images its own workloads run. One DaemonSet is rendered per key that has a
# non-empty images list; the default below renders nothing.
#
# Each listed image runs as a sleeping container, which is what makes the image genuinely
# in-use and therefore immune to image GC. An initContainer that exits would leave the image
# unused and reclaimable, and the pod would keep reporting Running after the cache was gone.
# The cost is that the node cannot reclaim these images under disk pressure without evicting
# the prewarm pod first — which is the intended order, since prewarm is lowest priority.
#
# Pin by DIGEST. A tag is mutable, so `repo:v1` can name a different image on the node than
# in the registry and the node would report a warm cache while holding the wrong layers. The
# template rejects anything without @sha256:. Filter on imageTags so an untagged intermediate
# or a failed build is never picked up:
#   DIGEST=$(aws ecr describe-images --repository-name <repo> \
#     --query 'sort_by(imageDetails[?imageTags],&imagePushedAt)[-1].imageDigest' --output text)
#   --set "prewarm.gpu-ddp.images[0]=$(terraform output -raw ddp_sample_ecr_url)@$DIGEST"
#
# Pin the MANIFEST LIST digest, not a per-architecture child digest. A child digest bypasses
# the node's platform resolution, so warming an arm64 child on an x86_64 pool fails with
# "exec format error" on every node of that pool.
#
# Only warm images a pool actually starts. Every entry costs a pull and node disk on EVERY
# node of that pool, and on a Capacity Block pool the reservation is billed while it happens
# (warming there is still the highest-value case — the pull happens before the workload lands,
# on time that is already paid for).
#
# Each listed image must contain /bin/sh and sleep, and must run them as its default USER
# under a dropped-capability securityContext. That holds for the CUDA, vLLM and Neuron images
# in this book. A distroless or scratch image cannot be warmed this way: it has no shell, so
# the container crash-loops and the DaemonSet never becomes healthy.
#
# Per-pool tolerations can be added when a pool carries a taint beyond the GPU/Neuron device
# taints the template already tolerates:
#   prewarm:
#     gpu-cb:
#       images: [...]
#       tolerations:
#         - key: my-pool-taint
#           operator: Exists
prewarm: {}
#   gpu-ddp:
#     images:
#       - 111122223333.dkr.ecr.us-west-2.amazonaws.com/ddp-sample@sha256:...

# PriorityClass for the prewarm DaemonSets. Must be a class whose value is BELOW every real
# workload so prewarm is what the scheduler preempts and the kubelet evicts first under
# pressure — the cache-headroom class from Advanced01 (value: -10) is the intended one. Left
# empty by default because the class is created by the reader in that chapter, and naming a
# class that does not exist would make every prewarm pod unschedulable.
#
# Being preempted or evicted mid-pull only costs the time already spent: completed layers stay
# in the containerd content store, so the restart re-fetches at most the layer that was in
# flight. Raising this above a real workload to protect the pull would let cache warming
# displace a training job, which is strictly worse than the cold pull it was trying to avoid.
prewarmPriorityClassName: ""
