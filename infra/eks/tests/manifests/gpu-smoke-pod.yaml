apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  namespace: ${NAMESPACE}
spec:
  restartPolicy: Never
  nodeSelector:
    karpenter.sh/nodepool: gpu-dev
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: nvidia-smi
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: "${GPU_COUNT}"
