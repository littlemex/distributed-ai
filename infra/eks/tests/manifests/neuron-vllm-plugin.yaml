# Qwen3-VL-4B served by the vLLM Neuron plugin on a single Trainium device (trn2.3xlarge).
# Used by the standalone `neuron` suite. Requests the whole DEVICE (aws.amazon.com/neuron), not
# individual neuroncores: a neuroncore request makes the device plugin inject NEURON_RT_VISIBLE_CORES,
# which the plugin's tensor-parallel (multiprocessing) worker rejects. Recreate strategy: the node
# has one Trainium device, so a rolling surge pod would deadlock on the busy device.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuron-qwen3vl
  namespace: ${NAMESPACE}
  labels: { app: neuron-qwen3vl, app.kubernetes.io/managed-by: eks-regression-tests }
spec:
  replicas: 1
  # First run pulls a multi-GB DLC, downloads the model, then compiles it to NEFF; that exceeds the
  # default 600s progress deadline (kubectl rollout status would give up). Allow up to 40 min.
  progressDeadlineSeconds: 2400
  strategy: { type: Recreate }
  selector: { matchLabels: { app: neuron-qwen3vl } }
  template:
    metadata: { labels: { app: neuron-qwen3vl } }
    spec:
      containers:
        - name: vllm
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.21.0.1.0.0-neuronx-py313-sdk2.31.0-ubuntu24.04
          command: ["vllm", "serve", "Qwen/Qwen3-VL-4B-Instruct"]
          args:
            - --tensor-parallel-size=4
            - --max-num-seqs=4
            - --max-model-len=8192
            - --no-async-scheduling
            - --port=8000
          env:
            - { name: VLLM_CACHE_ROOT, value: /work/neuron_cache }
            - { name: NEURON_SKIP_EFA_AFFINITY, value: "1" }
          securityContext:
            capabilities: { add: ["IPC_LOCK"] }
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            limits:   { aws.amazon.com/neuron: "1", memory: 96Gi }
            requests: { aws.amazon.com/neuron: "1", cpu: "8", memory: 24Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 240
          volumeMounts:
            - { name: cache, mountPath: /work/neuron_cache }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: neuron-qwen3vl
  namespace: ${NAMESPACE}
  labels: { app.kubernetes.io/managed-by: eks-regression-tests }
spec:
  selector: { app: neuron-qwen3vl }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
