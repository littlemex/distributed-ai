apiVersion: batch/v1
kind: Job
metadata:
  name: cuda-vectoradd
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: ${GPU_NODEPOOL}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vectoradd
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda11.7.1
          resources:
            limits:
              nvidia.com/gpu: "1"
