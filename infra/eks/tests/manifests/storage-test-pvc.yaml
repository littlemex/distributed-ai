apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fsx-claim-test
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4800Gi
  volumeName: fsx-training-test
  storageClassName: ""
