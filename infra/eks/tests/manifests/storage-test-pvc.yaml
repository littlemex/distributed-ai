apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fsx-claim-test
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4800Gi
  volumeName: ${FSX_TEST_PV_NAME}
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openzfs-claim-test
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 256Gi
  volumeName: ${OPENZFS_TEST_PV_NAME}
  storageClassName: ""
