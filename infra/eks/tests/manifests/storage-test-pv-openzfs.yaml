apiVersion: v1
kind: PersistentVolume
metadata:
  name: openzfs-shared-test
spec:
  capacity:
    storage: 256Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: ${NAMESPACE}
    name: openzfs-claim-test
  csi:
    driver: fsx.openzfs.csi.aws.com
    volumeHandle: ${OPENZFS_VOLUME_HANDLE}-test
    volumeAttributes:
      DNSName: ${OPENZFS_DNS_NAME}
      ResourceType: "filesystem"
