# The family the economics favour: tens of thousands of input tokens, one letter out. The box's input is a
# quarter of the cheapest API's and its output is barely cheaper, so the saving per request scales with the
# input -- which is why this run exists and the classification one was only the plumbing.
id: 2026-08-27-longctx-v1
serving_ref: sha256:PLACEHOLDER-set-by-deploy

layers:
  - id: box-qwen36-tp2x2
    kind: self_hosted
    model: Qwen/Qwen3.6-35B-A3B
    endpoint: http://qwen-serving.qwen-trial.svc.cluster.local:8000/v1/chat/completions
    hourly_usd: 15.2174
    serving_ref: sha256:PLACEHOLDER-set-by-deploy
    input_usd_per_mtok: 0.236
    output_usd_per_mtok: 4.12
    pricing_status: measured
  - id: api-haiku-4-5
    kind: api
    model: claude-haiku-4-5
    endpoint: https://d8b03j8erit4k.cloudfront.net/v1/chat/completions
    input_usd_per_mtok: 1.00
    output_usd_per_mtok: 5.00
    cache_read_usd_per_mtok: 0.10
    pricing_status: list

suites:
  - id: longctx-mc-v1
    family: long_context_choice
    items: specs/items/longctx-mc-v1.jsonl
    items_provenance: public-benchmark   # LongBench-v2, filtered to fit the 262k window
    task_plugin: tasks.longctx_mc
    scorer: scorers.exact_label
    baseline_layer: api-haiku-4-5
    floor:
      kind: paired_non_inferiority
      metric: exact_choice
      margin_pp: 4.0        # wider than classification: 24 items cannot resolve two points
      confidence: 0.80
    length_bins: [20000, 60000, 100000]

policies:
  - id: direct
    steps:
      - layer_ref: box-qwen36-tp2x2

operation_points:
  - id: quality-c1
    cell_kind: quality
    concurrency: 1
    input_tokens: 24000
    output_tokens: 6
    ephemeral_storage: 8Gi
    serving_ref: sha256:PLACEHOLDER-set-by-deploy
  # Sixteen, not sixty-four: at this input length prefill is compute-bound and saturates early, so a
  # higher number would only add queueing. The classification family's shape saturated at sixty-four.
  - id: perf-c16
    cell_kind: perf
    concurrency: 16
    input_tokens: 24000
    output_tokens: 6
    ephemeral_storage: 30Gi
    serving_ref: sha256:PLACEHOLDER-set-by-deploy
    replicas: 2
    tensor_parallel: 2

cells:
  - id: lc-box-quality
    suite: longctx-mc-v1
    layer: box-qwen36-tp2x2
    policy: direct
    operation_point: quality-c1
    seed: 20260827
  - id: lc-baseline-quality
    suite: longctx-mc-v1
    layer: api-haiku-4-5
    policy: direct
    operation_point: quality-c1
    seed: 20260827
  - id: lc-box-perf
    suite: longctx-mc-v1
    layer: box-qwen36-tp2x2
    policy: direct
    operation_point: perf-c16
    seed: 20260827
