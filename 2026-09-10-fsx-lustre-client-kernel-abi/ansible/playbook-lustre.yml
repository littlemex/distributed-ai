---
# Install the FSx for Lustre client. Applied to a running host it configures that host; applied by
# Packer it configures the image. The role calls files/lustre_installer.sh and then asserts, on the
# host itself, that the module matches the running kernel and that a mount would work.
- name: Configure the FSx for Lustre client
  hosts: all
  become: true
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - aws_lustre
