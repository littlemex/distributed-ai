---
# Amazon Linux 2023 ships the Lustre client kernel module inside the kernel package, so the
# module never has to be matched to a kernel release by hand. Only the userspace package is
# installed here.
- name: Require Amazon Linux 2023
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Amazon"
      - ansible_distribution_major_version == "2023"
    fail_msg: >-
      this role supports Amazon Linux 2023 on the Red Hat family, found
      {{ ansible_distribution }} {{ ansible_distribution_major_version }}

- name: Install the client userspace package
  ansible.builtin.dnf:
    name: "{{ aws_lustre_dnf_package }}"
    state: present

- name: Verify the kernel package provides the module
  ansible.builtin.command: "rpm -q --whatprovides kmod-lustre-client"
  register: aws_lustre_kmod_provider
  changed_when: false

- name: Report the module provider
  ansible.builtin.debug:
    msg: "kmod-lustre-client comes from {{ aws_lustre_kmod_provider.stdout_lines | join(', ') }}"
