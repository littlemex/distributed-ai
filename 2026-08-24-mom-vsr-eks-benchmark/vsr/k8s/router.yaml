# Semantic Router (ExtProc) and Envoy in one pod.
#
# They are co-located deliberately: the ExtProc call is on the request path for
# every benchmark request, so it must not cross a node boundary and add network
# variance to the latency the benchmark reports. Envoy talks to the ExtProc over
# loopback, which is also why the generated Envoy config points its extproc
# cluster at 127.0.0.1.
#
# Both configs are generated by build_config.py into ConfigMaps that deploy.sh
# creates; they are not checked in because they carry deployment addresses.
#
# The ${...} references are resolved by envsubst in deploy.sh, so images, the
# storage class and the config checksum stay out of this file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vsr-models
  labels:
    app.kubernetes.io/name: semantic-router
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${VSR_STORAGE_CLASS}
  resources:
    requests:
      storage: ${VSR_MODELS_VOLUME_SIZE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vsr
  labels:
    app.kubernetes.io/name: semantic-router
spec:
  # One replica on purpose. The selector's latency factor is fed by
  # per-process latency statistics, so a second replica would observe and act on
  # half the traffic each and make the routing decisions harder to reason about.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: semantic-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semantic-router
      annotations:
        # Roll the pod when either config changes.
        checksum/config: "${CONFIG_CHECKSUM}"
    spec:
      containers:
        - name: router
          image: ${VSR_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["--secure=false"]
          env:
            - name: LD_LIBRARY_PATH
              value: /app/lib
            # The classification API answers "which decision would this take, and
            # which model would be named" without calling a model, which is how the
            # classifier's accuracy and the selector's choices are measured for
            # free. It binds to loopback by default, so the Service port that
            # advertises it reaches nothing. Widening the bind alone makes the
            # router refuse to start it at all: a non-loopback address demands
            # either remote_exposure, which is about exposing it beyond the
            # cluster, or this acknowledgement that the listener is
            # container-local. It is — the Service is ClusterIP.
            - name: VLLM_SR_MANAGEMENT_INTERNAL_LISTENER
              value: "true"
            # The gateway credential the router injects as the upstream bearer
            # token. Referenced from the router config by name only.
            - name: STRATOCLAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vsr-gateway-credentials
                  key: api-key
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8080
              name: classify-api
            - containerPort: 9190
              name: metrics
          volumeMounts:
            - name: router-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: models
              mountPath: /app/models
          startupProbe:
            tcpSocket:
              port: grpc
            # The router downloads its classifier models on first start, so the
            # startup budget has to cover a cold PVC, not a warm one.
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
        - name: envoy
          image: ${ENVOY_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --log-level
            - info
          ports:
            - containerPort: 8801
              name: http
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: router-config
          configMap:
            name: vsr-router-config
        - name: envoy-config
          configMap:
            name: vsr-envoy-config
        - name: models
          persistentVolumeClaim:
            claimName: vsr-models
---
apiVersion: v1
kind: Service
metadata:
  name: vsr
  labels:
    app.kubernetes.io/name: semantic-router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: semantic-router
  ports:
    - name: http
      port: 8801
      targetPort: http
    - name: classify-api
      port: 8080
      targetPort: classify-api
    - name: metrics
      port: 9190
      targetPort: metrics
