# InferencePool + EPP Service。
# InferencePool が selector app=mt-lora-pool で 8 個の vLLM Pod を endpoint として束ね、
# endpointPickerRef で EPP Service:9002 (ext_proc gRPC) に routing 判断を委譲する。
#
# CRD version は cluster にインストール済みの inference.networking.k8s.io/v1 を使う
# (pd-disaggregation と同一)。
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: mt-lora-pool
  namespace: mt-serving
spec:
  appProtocol: http
  selector:
    matchLabels:
      app: mt-lora-pool        # vLLM Deployment の Pod ラベルと一致
  targetPorts:
  - number: 8000
  endpointPickerRef:
    failureMode: FailClose
    group: ""
    kind: Service
    name: mt-lora-epp
    port:
      number: 9002
---
# EPP Service。
#   - 9002 : ext_proc gRPC (Envoy → EPP)
#   - 9090 : EPP metrics
#   - 80   : Envoy sidecar listener 8081 (client → Envoy。実際の OpenAI API 入口)
apiVersion: v1
kind: Service
metadata:
  name: mt-lora-epp
  namespace: mt-serving
  labels: { app: mt-lora-epp }
spec:
  type: ClusterIP
  selector:
    inferencepool: mt-lora-epp
  ports:
  - { name: grpc-ext-proc, port: 9002, protocol: TCP, targetPort: 9002 }
  - { name: http-metrics,  port: 9090, protocol: TCP, targetPort: 9090 }
  - { name: http,          port: 80,   protocol: TCP, targetPort: 8081 }
