# ベンチ実行用クライアント Pod。
# 計測は必ずクラスタ内・vLLM と同一ノードから行う (前回の 1Pod localhost 計測と
# ネットワーク条件を揃えるため)。同一ノードの Pod 間通信は veth で sub-ms、
# TTFT(数百 ms オーダ) に対し無視できる。port-forward 経由 (Mac から) は厳禁。
#
# image は vLLM と同じものを使い、aiohttp/numpy のバージョンを計測側と完全一致させる
# (aiohttp 3.14.1 / numpy 2.3.5 を pod 内で確認済み)。GPU は要求しない。
apiVersion: v1
kind: Pod
metadata:
  name: mt-lora-bench
  namespace: mt-serving
  labels: { app: mt-lora-bench }
spec:
  schedulerName: kai-scheduler
  priorityClassName: train
  restartPolicy: Never
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
    - { key: vpc.amazonaws.com/efa, operator: Exists, effect: NoSchedule }
    - { key: workload, operator: Equal, value: bench, effect: NoSchedule }
    - { key: capacity-reservation, operator: Exists, effect: NoSchedule }
    - { key: sagemaker.amazonaws.com/node-health-status, operator: Equal, value: Schedulable, effect: NoSchedule }
  # vLLM pod と同一ノードに配置 (同一ノード pod 間通信で計測条件を揃える)
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: { app: mt-lora-pool }
          topologyKey: kubernetes.io/hostname
  imagePullSecrets:
    - { name: ecr-pull-secret }
  containers:
    - name: bench
      image: <ACCOUNT_ID>.dkr.ecr.us-west-2.amazonaws.com/vllm-uccl-ep:vllm0.21.0-uccl-0dc87eb-cu13-b300-fix1
      imagePullPolicy: IfNotPresent
      command: ["bash","-lc","sleep infinity"]
      resources:
        requests: { cpu: "8", memory: "16Gi" }
        limits: { cpu: "16", memory: "32Gi" }
