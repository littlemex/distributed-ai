# inference-perf: Approach A small model (Bedrock Gemma 4 E2B)。
# 31B 版 (bedrock-gemma4-31b-1000tenants.yaml) と同構成。model_name のみ差し替え。
# E2B は $0.04/$0.08 と非常に安く、自前 4B との $/token 比較ではほぼ Bedrock 優位 (§11)。
server:
  type: vllm
  model_name: google.gemma-4-e2b
  base_url: https://bedrock-mantle.us-west-2.api.aws/openai/v1
  api_key: "${BEDROCK_API_KEY}"
  ignore_eos: false

api:
  type: chat
  streaming: true

tokenizer:
  pretrained_model_name_or_path: google/gemma-3-4b-it

load:
  type: concurrent
  stages:
    - num_requests: 2000
      concurrency_level: 100
    - num_requests: 2000
      concurrency_level: 500
    - num_requests: 2000
      concurrency_level: 1000

data:
  type: shareGPT
  path: /data/bedrock_dataset_medium_1000tenants.jsonl

report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
    per_adapter: false
    percentiles: [50, 90, 95, 99]
  goodput:
    constraints:
      ttft: 3.0
      tpot: 0.15
      request_latency: 60.0
