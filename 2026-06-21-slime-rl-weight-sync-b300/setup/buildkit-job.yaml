apiVersion: batch/v1
kind: Job
metadata:
  name: slime-ngc-build
  namespace: myuser-slime
spec:
  ttlSecondsAfterFinished: 172800
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector: { nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC }
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        - { key: workload, operator: Equal, value: bench, effect: NoSchedule }
        - { key: capacity-reservation, operator: Exists, effect: NoSchedule }
        - { key: sagemaker.amazonaws.com/node-health-status, operator: Equal, value: Schedulable, effect: NoSchedule }
      containers:
        - name: buildkit
          image: moby/buildkit:v0.18.2
          securityContext: { privileged: true }
          command:
            - sh
            - -c
            - |
              set -eux
              buildkitd &
              for i in $(seq 1 30); do buildctl debug workers >/dev/null 2>&1 && break; sleep 2; done
              buildctl build                 --frontend dockerfile.v0                 --local context=/workspace                 --local dockerfile=/workspace                 --output type=image,name=776010787911.dkr.ecr.us-west-2.amazonaws.com/slime:v0.2.4-ngc-b300,push=true                 --progress=plain
          env:
            - { name: DOCKER_CONFIG, value: /root/.docker }
          resources:
            requests: { cpu: "32", memory: "96Gi", ephemeral-storage: "150Gi" }
            limits:   { cpu: "180", memory: "700Gi", ephemeral-storage: "500Gi" }
          volumeMounts:
            - { name: ctx, mountPath: /workspace }
            - { name: docker-config, mountPath: /root/.docker }
      volumes:
        - name: ctx
          configMap:
            name: slime-ngc-build-context
            items:
              - { key: Dockerfile, path: Dockerfile }
              - { key: requirements.txt, path: requirements.txt }
        - name: docker-config
          secret:
            secretName: ecr-myuser-own
            items:
              - { key: .dockerconfigjson, path: config.json }
