# BuildKit Job: vLLM 0.21.0 + NIXL + UCCL-EP image を B300 node 上で build し
# 自アカウント ECR (776010787911) に push する。
#
# 設計:
#   - privileged buildkitd を 1 Pod で起動し buildctl で build → ECR push
#   - Dockerfile は configMap (build-dockerfile) から /workspace/Dockerfile に配置
#   - Dockerfile は COPY/ADD なし (全部 git clone) なので context は Dockerfile 1枚
#   - GPU は要求しない (build の smoke test は import チェックのみ)。CPU パワー目的で
#     B300 node を 1 台一時占有する (192 vCPU で MAX_JOBS=32 が活きる)
#   - ECR 認証は secret ecr-akazawt-own を ~/.docker/config.json に mount
#
# 注意1: --mount=type=cache を使う Dockerfile なので BuildKit 必須 (Kaniko 不可)
# 注意2: rootless buildkit だと EFA installer tarball 展開時に tar の chown が
#        user namespace 内で失敗 ("Cannot change ownership to uid ...: Invalid
#        argument")。Dockerfile を触らず通すため privileged (非 rootless) buildkitd
#        を使う。root + 通常 mount namespace なら chown 成功する。
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-build
  namespace: akazawt-disagg
spec:
  ttlSecondsAfterFinished: 172800
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B300-SXM6-AC
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        - { key: workload, operator: Equal, value: bench, effect: NoSchedule }
        - { key: capacity-reservation, operator: Exists, effect: NoSchedule }
        - { key: sagemaker.amazonaws.com/node-health-status, operator: Equal, value: Schedulable, effect: NoSchedule }
      containers:
        - name: buildkit
          image: moby/buildkit:v0.18.2
          securityContext:
            # 非 rootless buildkitd は privileged 必須 (OCI worker が mount/chroot を行う)。
            # これにより tar の chown が成功し EFA installer tarball 展開を通せる。
            privileged: true
          command:
            - sh
            - -c
            - |
              set -eux
              # buildkitd を root でバックグラウンド起動
              buildkitd &
              # daemon が立ち上がるまで待つ
              for i in $(seq 1 30); do
                buildctl debug workers >/dev/null 2>&1 && break
                echo "waiting for buildkitd... ($i)"; sleep 2
              done

              # build + ECR push (cache mount は buildkit がネイティブ対応)
              buildctl build \
                --frontend dockerfile.v0 \
                --local context=/workspace \
                --local dockerfile=/workspace \
                --output type=image,name=776010787911.dkr.ecr.us-west-2.amazonaws.com/vllm-uccl-ep:vllm0.21.0-uccl-0dc87eb-cu13-b300,push=true \
                --export-cache type=inline \
                --progress=plain
          env:
            - name: DOCKER_CONFIG
              value: /root/.docker
          resources:
            requests:
              cpu: "32"
              memory: "96Gi"
              ephemeral-storage: "120Gi"
            limits:
              cpu: "180"
              memory: "700Gi"
              ephemeral-storage: "400Gi"
          volumeMounts:
            - { name: dockerfile, mountPath: /workspace }
            - { name: docker-config, mountPath: /root/.docker }
      volumes:
        - name: dockerfile
          configMap:
            name: build-dockerfile
            items:
              - { key: Dockerfile, path: Dockerfile }
        - name: docker-config
          secret:
            secretName: ecr-akazawt-own
            items:
              - { key: .dockerconfigjson, path: config.json }
