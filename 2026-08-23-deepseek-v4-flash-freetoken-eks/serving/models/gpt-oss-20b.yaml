# Model facts for openai/gpt-oss-20b.
# FACTS ONLY: verifiable from the checkpoint's config.json and model card. Tuning lives in
# serving/values/gpt-oss-20b.values.yaml.
#
# Role in this reference: the SMOKE model. It is the largest MoE whose pinned expert banks fit in
# a g6e.xlarge (32 GiB host RAM), which makes it the cheap way to prove the image, the chart, the
# Karpenter pool, and the S3 Files mount all work BEFORE spending g6e.8xlarge hours on
# DeepSeek-V4-Flash. It deliberately exercises the same offload code path, just at 1/14 the size.

model_id: openai/gpt-oss-20b
architecture: GptOssForCausalLM               # model_type: gpt_oss
modality: text-generation
params_total: 21B

# MoE topology
num_local_experts: 32
num_experts_per_tok: 4
num_hidden_layers: 24

num_attention_heads: 64
num_key_value_heads: 8
head_dim: 64
hidden_size: 2880
intermediate_size: 2880
max_position_embeddings: 131072               # rope_scaling: yarn, factor 32.0
sliding_window: 128
vocab_size: 201088

# quantization_config.quant_method: mxfp4
# Excluded from quantization: self-attention, router, embed_tokens, lm_head -- so the FP4 saving
# applies to the expert MLPs, which is exactly what lands in the host banks.
weight_layout: mxfp4-experts

# --- pinned host-RAM requirement (derived, shown so the number is auditable) ---------------
# Expert MLP params per expert per layer:
#   gate_up_proj  hidden x 2*intermediate = 2880 x 5760 = 16,588,800
#   down_proj     intermediate x hidden   = 2880 x 2880  =  8,294,400
#                                                   sum  = 24,883,200
#   x 32 experts x 24 layers                             = 19.11B expert params
# At mxfp4 (4 bits + block scales, ~4.25 bits/param) that is ~10.1 GB ~= 9.5 GiB of banks.
# Comfortably inside a g6e.xlarge, which is the whole point of using it as the smoke.
expert_bank_pinned_gib: 10
min_host_ram_gib: 18
