# Model facts for deepseek-ai/DeepSeek-V4-Flash-0731.
# FACTS ONLY: everything here is mechanically verifiable from the checkpoint's config.json,
# the model card, or FreeToken's own source. Engine tuning (cache sizing, backend choice,
# concurrency) does NOT belong here -- it lives in serving/values/deepseek-v4-flash.values.yaml.

model_id: deepseek-ai/DeepSeek-V4-Flash-0731
architecture: DeepseekV4ForCausalLM          # model_type: deepseek_v4
modality: text-generation
dtype: bfloat16                              # storage is FP4/FP8 mixed, see weight_layout
params_total: 284B
params_active: 13B                           # 6 of 256 routed experts per token

# MoE topology
n_routed_experts: 256
num_experts_per_tok: 6
num_hidden_layers: 43

# attention: hybrid Compressed Sparse Attention (CSA) + Heavily Compressed Attention (HCA)
num_attention_heads: 64
num_key_value_heads: 1
head_dim: 512
hidden_size: 4096
moe_intermediate_size: 2048
max_position_embeddings: 1048576
rope_type: yarn                              # factor 16, beta_fast 32, beta_slow 1
vocab_size: 129280

# On-disk footprint: 46 safetensors shards, ~160 GB total.
# "MoE expert parameters use FP4 precision; most other parameters use FP8" (model card).
weight_layout: fp4-experts-fp8-dense
approx_checkpoint_gb: 160

# --- THE binding constraint on this model, and why it drives instance choice -------------
# FreeToken's offload backend keeps expert weights in PINNED host RAM, not on disk and not
# in VRAM. Its own source states the figure for this checkpoint:
#
#   python/freetoken/moe/host_banks.py
#     "registering a lazy mmap first faults+zero-fills every page
#      (~137 GiB -> ~47 s for DSV4)"
#
# The banks are anonymous mmap (`mmap.mmap(-1, size)` -- RAM, never file-backed) that are
# then cudaHostRegister'd with cudaHostRegisterPortable|cudaHostRegisterMapped and held for
# the process lifetime. Page-locking is by definition non-swappable, so host RAM is a HARD
# floor: swap cannot substitute for it, and there is no disk-resident expert path. The only
# non-pinned residency classes (LOCKED via mlock, PAGEABLE) are unimplemented -- both
# HostBank.lock() and MoeOffloadCache reject them with NotImplementedError, and mlock is
# itself non-swappable anyway.
expert_bank_pinned_gib: 137
min_host_ram_gib: 200        # 137 banks + non-expert weights + KV + load transients + OS

# Checkpoint layout gotcha (FreeToken docs/models.md, verbatim):
#   "DeepSeek-V4 checkpoints must keep the `inference/config.json` subdir -- the
#    authoritative model args are read from there."
# So a sync that flattens or prunes subdirectories produces a checkpoint FreeToken cannot
# read, even though the safetensors shards are all present.
requires_inference_config_subdir: true
