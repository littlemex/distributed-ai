apiVersion: ray.io/v1
kind: RayCluster
metadata:
  labels:
    app: miles-grpo
  name: miles-ray
  namespace: ${NAMESPACE}
spec:
  enableInTreeAutoscaling: false
  headGroupSpec:
    rayStartParams:
      dashboard-host: 0.0.0.0
      num-gpus: '0'
    template:
      metadata:
        labels:
          ray.io/node-type: head
      spec:
        containers:
        - env:
          - name: NVIDIA_VISIBLE_DEVICES
            value: void
          - name: RAY_memory_monitor_refresh_ms
            value: '0'
          - name: PYTHONPATH
            value: /root/Megatron-LM:/root/miles
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                key: HF_TOKEN
                name: hf-token
          - name: NCCL_DEBUG
            value: WARN
          image: ${FULL_IMAGE}
          imagePullPolicy: IfNotPresent
          name: ray-head
          ports:
          - containerPort: 6379
            protocol: TCP
          - containerPort: 8265
            protocol: TCP
          - containerPort: 10001
            protocol: TCP
          resources:
            limits:
              cpu: '4'
              memory: 16Gi
              ephemeral-storage: 60Gi
            requests:
              cpu: '2'
              memory: 8Gi
              ephemeral-storage: 40Gi
          volumeMounts:
          - mountPath: /fsx
            name: fsx
          - mountPath: /dev/shm
            name: dshm
        restartPolicy: Never
        terminationGracePeriodSeconds: 120
        volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: ${FSX_CLAIM}
        - emptyDir:
            medium: Memory
            sizeLimit: 64Gi
          name: dshm
        nodeSelector:
          node-role: cpu
  rayVersion: 2.55.1
  workerGroupSpecs:
  # Single-node baseline (Qwen3-4B mismatch arms). For the 2-node runs (4B 3-cycle
  # and 30B MoE colocated on 16 GPU, both hardware-verified over EFA) set
  # replicas/minReplicas/maxReplicas to 2 -- each worker is one p5en (8 GPU), so
  # 2 replicas = 16 GPU. Keep podAntiAffinity (below) so the two workers land on
  # separate nodes and the actor spans both.
  - groupName: gpu-workers
    maxReplicas: 2
    minReplicas: 1
    numOfHosts: 1
    rayStartParams:
      num-gpus: '${GPUS_PER_NODE}'
      resources: '"{\"gpu_node\": 1}"'
    replicas: 1
    template:
      metadata:
        labels:
          ray.io/node-type: worker
      spec:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: ray.io/node-type
                  operator: In
                  values:
                  - worker
              topologyKey: kubernetes.io/hostname
        containers:
        - env:
          - name: RAY_memory_monitor_refresh_ms
            value: '0'
          - name: PYTHONPATH
            value: /root/Megatron-LM:/root/miles
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                key: HF_TOKEN
                name: hf-token
          - name: FI_PROVIDER
            value: efa
          - name: FI_EFA_USE_DEVICE_RDMA
            value: '1'
          - name: FI_EFA_FORK_SAFE
            value: '1'
          - name: NCCL_PROTO
            value: Simple
          - name: NCCL_DEBUG
            value: WARN
          - name: RDMAV_FORK_SAFE
            value: '1'
          - name: NCCL_SOCKET_IFNAME
            value: ^lo
          - name: TOKENIZERS_PARALLELISM
            value: 'false'
          image: ${FULL_IMAGE}
          imagePullPolicy: IfNotPresent
          name: ray-worker
          resources:
            limits:
              cpu: '96'
              memory: 1900Gi
              nvidia.com/gpu: '${GPUS_PER_NODE}'
              vpc.amazonaws.com/efa: '${EFA_PER_NODE}'
            requests:
              cpu: '90'
              memory: 1800Gi
              nvidia.com/gpu: '${GPUS_PER_NODE}'
              vpc.amazonaws.com/efa: '${EFA_PER_NODE}'
          volumeMounts:
          - mountPath: /fsx
            name: fsx
          - mountPath: /dev/shm
            name: dshm
        nodeSelector:
          node-role: ${GPU_NODE_ROLE}
        restartPolicy: Never
        terminationGracePeriodSeconds: 300
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: ${FSX_CLAIM}
        - emptyDir:
            medium: Memory
            sizeLimit: 256Gi
          name: dshm
