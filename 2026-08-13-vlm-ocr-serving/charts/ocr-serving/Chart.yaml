apiVersion: v2
name: ocr-serving
description: |
  Bbox-grounded OCR / document-VLM serving for the distributed-ai EKS reference cluster.
  Serves up to three independent evidence channels, each behind the SAME /extract HTTP
  contract (grounded tokens: text + pixel bbox + optional confidence), each toggled on its own:

    * paddleocr  — PP-OCR detection+recognition (GPU): quad boxes + per-line score.
    * dots-ocr   — dots.ocr document VLM (GPU): layout blocks with bbox + text.
    * tesseract  — classic Tesseract (CPU): word boxes + per-word confidence; the
                   deliberately non-VLM, low-correlation channel.

  Each engine renders, independently:
    * imageBuild — a rootless-BuildKit Job that builds the engine's image in-cluster and
      pushes it to ECR (reuses the base module's image-builder ServiceAccount + Pod Identity).
    * <engine>   — a Deployment (single replica) + ClusterIP Service exposing /extract.

  Applied by hand with `helm template ... | kubectl apply -f -`, matching the base module's
  charts/experiments convention. This chart lives in the workload project, NOT in the reusable
  infra/eks module, so the base module stays untouched. The services have no auth, so they are
  reached over `kubectl port-forward` — the chart renders only ClusterIP Services.
type: application
version: 0.1.0
appVersion: "0.1.0"

# The in-cluster image builder Job is the shared image-builder-lib library chart (defined once in
# the base module). Run `helm dependency build ./charts/ocr-serving` once to vendor it before
# `helm template`. This crosses into the base module's chart on purpose (the workload reuses the
# builder); the base module itself stays untouched.
dependencies:
  - name: image-builder-lib
    version: 0.1.0
    repository: "file://../../../infra/eks/charts/image-builder-lib"
