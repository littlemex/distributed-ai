[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ec2-supportability"
dynamic = ["version"]
description = "Check EC2 Capacity Manager supportability scores (High, Medium, Low) and print them as a table, JSON, tab-separated text or shell variables"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.121",
    "jmespath>=1.0",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
ec2-supportability = "ec2_supportability.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ec2_supportability.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
