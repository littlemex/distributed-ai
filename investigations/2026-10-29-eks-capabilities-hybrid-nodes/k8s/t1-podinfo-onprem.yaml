# T1: the managed Argo CD deploys a Helm chart onto the on-premises (hybrid) node.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-onprem
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.17.0
    helm:
      valuesObject:
        replicaCount: 2
        ui:
          message: "deployed by EKS Capabilities Argo CD to the on-prem hybrid node"
        nodeSelector:
          eks.amazonaws.com/compute-type: hybrid
  destination:
    name: hub
    namespace: podinfo-onprem
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions: [CreateNamespace=true]
